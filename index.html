<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4a66">
<title>LabPath สพช.69</title>
<link rel="icon" href="logo.jpg"><link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* =====================================================================
 * ค่าที่ต้องแก้ก่อนใช้งาน
 * ---------------------------------------------------------------------
 * API_URL : Web app URL จาก Apps Script (Deploy › New deployment) ลงท้ายด้วย /exec
 * CAMP_PIN: ตั้งใจ "ไม่" ใส่ PIN ไว้ในไฟล์นี้ เพราะหน้าเว็บบน GitHub Pages ใครก็เปิดดูโค้ดได้
 *           PIN จริงเก็บใน Apps Script › Project Settings › Script Properties
 *           และเซิร์ฟเวอร์เป็นผู้ตรวจ (ผู้ใช้กรอก PIN ตอนเข้าใช้งานครั้งแรก เครื่องจะจำไว้)
 * ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyv3GgBzdSUErCzygnbsFFyDdmp4CREgQAW0tDIrN0bzqyM1vpgU4SVSDeVu_Kz_-9t/exec';
const APP_NAME = 'LabPath สพช.69';
</script>
<style>
/* =====================================================================
 * ธีม: ฟ้าหม่น (สีคณะสัตวแพทยศาสตร์) + ชมพู (สีจุฬาฯ)
 * สไตล์ระบบโรงพยาบาลแบบ CUHIS: ตัวอักษรเล็กกะทัดรัด แผงขอบบาง หัวแผงสีอ่อน
 * จอใหญ่ = กะทัดรัด (14px) · มือถือ = ปุ่ม/ช่องกรอกใหญ่ขึ้น (≥44px) ให้กดง่าย
 * ===================================================================== */
:root{
  --brand:#4a6a8c; --brand-dk:#2f4a66; --brand-lt:#e3ebf3; --brand-xlt:#f3f6fa;
  --pink:#b83f6e; --pink-lt:#fbe8ef; --pink-line:#e7a9c0;
  --bg:#edf1f5; --surface:#ffffff; --surface-2:#f6f8fb; --line:#d4dce5; --line-2:#e6ebf1;
  --text:#1f2a37; --muted:#5b6878;
  --ok:#2e7d4f; --ok-lt:#e3f3e9; --warn:#9a5b00; --warn-lt:#fdf3dc; --err:#b42335; --err-lt:#fde7ea;
  --info:#2f5f9a; --info-lt:#e2ecf8; --gray:#5b6878; --gray-lt:#e9edf2;
  --radius:6px; --shadow:0 1px 2px rgba(31,42,55,.06);
  --hdr:50px; --nav:60px; --ctl:34px; --fs:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Noto Sans Thai','Sarabun',Tahoma,system-ui,sans-serif;font-size:var(--fs);line-height:1.5;color:var(--text);background:var(--bg);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.hidden{display:none!important}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ===================== Header + เมนู ===================== */
header.top{position:fixed;inset:0 0 auto 0;height:var(--hdr);background:var(--brand-dk);color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:30;border-bottom:3px solid var(--pink)}
header.top .logo{font-weight:600;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.mark{background:var(--pink);color:#fff;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:700;letter-spacing:.05em}
header.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:0;cursor:pointer;min-height:28px;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.on{background:#e3f3e9;color:#1d5c38}.pill.off{background:#e9edf2;color:#334155}.pill.q{background:#fdf3dc;color:#6b4000}.pill.bad{background:#fde7ea;color:#8a1a29}
.userchip{font-size:12px;line-height:1.25;text-align:right;max-width:40vw;overflow:hidden;padding:4px 8px;border-radius:4px}
.userchip:hover{background:rgba(255,255,255,.1)}
.userchip b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:0;color:inherit;min-width:36px;min-height:36px;border-radius:6px;cursor:pointer;font-size:14px}
.iconbtn:hover{background:rgba(255,255,255,.12)}

nav.side{position:fixed;top:var(--hdr);bottom:0;left:0;width:216px;background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:8px 0;z-index:20}
nav.side a{display:flex;align-items:center;gap:8px;padding:7px 14px;color:var(--text);text-decoration:none;min-height:36px;border-left:3px solid transparent;font-size:14px}
nav.side a .ic{width:20px;text-align:center;font-size:14px}
nav.side a:hover{background:var(--brand-xlt)}
nav.side a.act{background:var(--brand-lt);color:var(--brand-dk);font-weight:600;border-left-color:var(--pink)}
nav.side .sec{font-size:11px;color:var(--muted);padding:12px 14px 4px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
main{padding:calc(var(--hdr) + 14px) 16px 28px 232px;max-width:1320px}
nav.bottom{display:none}
.scrim{display:none}
header.top .logo .short{display:none}

/* ===================== มือถือ: ปุ่มใหญ่ขึ้น เมนูล่าง ===================== */
@media (max-width:899px){
  :root{--ctl:44px;--fs:15px}
  nav.side{transform:translateX(-105%);transition:transform .2s;width:270px;box-shadow:4px 0 20px rgba(0,0,0,.2);z-index:40;top:0;padding-top:12px}
  nav.side a{min-height:44px}
  nav.side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  main{padding:calc(var(--hdr) + 10px) 12px calc(var(--nav) + 24px + env(safe-area-inset-bottom))}
  nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);z-index:25}
  nav.bottom a,nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;font-weight:600}
  nav.bottom .ic{font-size:18px;line-height:1}
  nav.bottom a.act{color:var(--brand-dk)}
  nav.bottom a.act .ic{filter:none}
  nav.bottom a.plus .ic{background:var(--pink);color:#fff;border-radius:12px;width:42px;height:30px;display:flex;align-items:center;justify-content:center}
  .userchip{display:none}
  header.top .logo .full{display:none}
  header.top .logo .short{display:inline}
  input[type=text],input[type=password],input[type=search],input:not([type]),select,textarea{font-size:16px!important}
}

/* ===================== Components ===================== */
h1{font-size:18px;margin:0 0 10px;font-weight:600;color:var(--brand-dk)}
h2{font-size:15px;margin:0 0 8px;font-weight:600;color:var(--brand-dk)}
h3{font-size:14px;margin:0 0 6px;font-weight:600}
/* แผงแบบ HIS: ขอบบาง + หัวแผงสีอ่อน */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:12px}
.card>h2:first-child{margin:-12px -14px 10px;padding:7px 14px;background:var(--brand-xlt);border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;font-size:14px;border-left:3px solid var(--brand)}
.card.flat{box-shadow:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--ctl);padding:4px 14px;border-radius:5px;border:1px solid #c3cdd8;background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--text);font-size:14px}
.btn:hover{background:var(--brand-xlt);border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-dk)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:#fff;border-color:var(--pink-line);color:var(--err)}
.btn.warn{background:var(--warn-lt);border-color:#e9c77a;color:#6b4000}
.btn.big{min-height:max(40px,var(--ctl));font-size:15px;padding:6px 20px;font-weight:600}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:3px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st-pending{background:var(--gray-lt);color:#334155;border-color:#cbd3dc}
.st-working{background:var(--info-lt);color:#1f4677;border-color:#a9c3e3}
.st-review{background:var(--warn-lt);color:#6b4000;border-color:#e9c77a}
.st-verified{background:var(--ok-lt);color:#1d5c38;border-color:#9fd2b3}
.st-revise{background:var(--err-lt);color:#8a1a29;border-color:#f0a8b3}
.badge.pend{background:var(--pink-lt);color:var(--pink);border-color:var(--pink-line)}
.fl{display:inline-block;min-width:20px;text-align:center;border-radius:3px;font-weight:700;font-size:11px;padding:0 5px}
.fl.F{background:#fdf3dc;color:#6b4000}.fl.L{background:var(--brand-lt);color:var(--brand-dk)}

.alert{border-radius:5px;padding:8px 12px;margin:0 0 10px;border:1px solid;border-left-width:4px}
.alert.err{background:var(--err-lt);border-color:#f0a8b3;color:#8a1a29}
.alert.warn{background:var(--warn-lt);border-color:#e9c77a;color:#6b4000}
.alert.info{background:var(--brand-xlt);border-color:#b9cadc;color:var(--brand-dk)}
.alert.ok{background:var(--ok-lt);border-color:#9fd2b3;color:#1d5c38}

/* ===================== ฟอร์ม ===================== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 14px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.l{grid-column:span 2}
.fld.full{grid-column:1/-1}
@media (max-width:420px){.fld.l{grid-column:1/-1}}
.fld>label,.fld>.lab{font-size:13px;font-weight:500;color:var(--muted)}
.req{color:var(--pink);margin-left:2px}
input[type=text],input[type=password],input[type=search],input:not([type]),select,textarea{width:100%;min-height:var(--ctl);padding:4px 10px;border:1px solid #b9c5d2;border-radius:4px;background:#fff;font-size:14px}
textarea{min-height:64px;resize:vertical;padding:6px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid #b9cfe6;border-color:var(--brand)}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--text)}
.fld.invalid input,.fld.invalid select,.fld.invalid .chips{border-color:var(--err);outline:2px solid #f6c3cb}
.fld .err-msg{color:var(--err);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;border-radius:4px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;min-height:calc(var(--ctl) - 2px);padding:2px 12px;border:1px solid #b9c5d2;border-radius:4px;background:#fff;cursor:pointer;user-select:none;font-size:13px}
.chip span:hover{border-color:var(--brand)}
.chip input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip input:checked+span::before{content:"✓ "}
.chip input:focus-visible+span{outline:2px solid #b9cfe6}
.chip input:disabled+span{opacity:.65;cursor:default}
fieldset{border:0;padding:0;margin:0}
details.sec{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;box-shadow:var(--shadow)}
details.sec>summary{cursor:pointer;padding:7px 14px;font-weight:600;font-size:14px;color:var(--brand-dk);list-style:none;display:flex;align-items:center;gap:8px;min-height:36px;background:var(--brand-xlt);border-bottom:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--radius) var(--radius) 0 0}
details.sec:not([open])>summary{border-bottom:0;border-radius:var(--radius)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.sec:not([open])>summary::after{content:"▸"}
details.sec>.body{padding:10px 14px 14px}
.seg{display:flex;border:1px solid var(--brand);border-radius:5px;overflow:hidden}
.seg button{flex:1;min-height:var(--ctl);border:0;background:#fff;font-weight:600;font-size:14px;cursor:pointer;color:var(--brand-dk)}
.seg button+button{border-left:1px solid var(--brand)}
.seg button.act{background:var(--brand);color:#fff}
.formbar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:12px 0 6px;display:flex;gap:8px;flex-wrap:wrap;z-index:5}
@media (max-width:899px){.formbar{bottom:calc(var(--nav) + env(safe-area-inset-bottom))}}

/* ===================== ตัวเลขสรุป / ตาราง ===================== */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;border-top:3px solid var(--gray);text-decoration:none;color:var(--text)}
.stat:hover{border-color:var(--brand)}
.stat .n{font-size:22px;font-weight:600;line-height:1.2}
.stat .t{font-size:12px;color:var(--muted)}
.stat.s-all{border-top-color:var(--pink)}.stat.s-pending{border-top-color:#8a96a5}.stat.s-working{border-top-color:#3f74b5}
.stat.s-review{border-top-color:#c98a12}.stat.s-verified{border-top-color:#2e7d4f}.stat.s-revise{border-top-color:#c4344a}
.bar{height:8px;background:var(--gray-lt);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.bar.over>i{background:var(--err)}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:5px 8px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
table.tbl th{background:var(--brand-lt);font-size:12px;color:var(--brand-dk);font-weight:600;border-bottom:1px solid var(--line)}
table.tbl tbody tr:nth-child(even) td{background:var(--surface-2)}
table.tbl tbody tr:hover td{background:#eef3f9}
table.tbl td.n,table.tbl th.n{text-align:right}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line-2);border-radius:4px}

/* รายการเคส */
.clist{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:4px;overflow:hidden}
.citem{display:flex;gap:10px;align-items:center;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line-2);text-decoration:none;color:var(--text);min-height:44px}
.citem:last-child{border-bottom:0}
.citem:nth-child(even){background:var(--surface-2)}
.citem:hover{background:#eef3f9}
.citem .sn{font-weight:600;font-size:13px;min-width:104px;color:var(--brand-dk)}
.citem .main{flex:1;min-width:0}
.citem .main .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .main .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.citem{flex-wrap:wrap}.citem .sn{min-width:0}}
.empty{padding:20px;text-align:center;color:var(--muted)}

/* Patient banner แบบ HIS */
.banner{background:var(--brand-dk);color:#fff;border-radius:var(--radius);padding:8px 14px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px 20px;align-items:center;position:sticky;top:calc(var(--hdr) + 6px);z-index:10;border-left:5px solid var(--pink);box-shadow:0 2px 6px rgba(31,42,55,.15)}
.banner .sn{font-size:17px;font-weight:600;letter-spacing:.02em}
.banner .kv{display:flex;flex-direction:column;line-height:1.25}
.banner .kv small{opacity:.75;font-size:11px}
.banner .kv b{font-size:13px;font-weight:600}
@media (max-width:600px){.banner{position:static}.banner .kv.hide-sm{display:none}}
.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0}
.tabs a{padding:7px 14px;white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;min-height:38px;display:flex;align-items:center;gap:6px;font-size:13px}
.tabs a:hover{color:var(--brand-dk);background:var(--brand-xlt)}
.tabs a.act{color:var(--brand-dk);border-bottom-color:var(--pink);font-weight:600}

/* Modal / toast */
.modal{position:fixed;inset:0;background:rgba(20,32,46,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:12px}
.modal .box{background:var(--surface);border-radius:8px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);border-top:4px solid var(--pink)}
.modal .box h2{margin-top:0;font-size:16px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hdr) + 10px);z-index:70;display:flex;flex-direction:column;gap:6px;width:min(92vw,400px);pointer-events:none}
.toast{padding:9px 14px;border-radius:5px;color:#fff;font-weight:500;box-shadow:0 6px 16px rgba(0,0,0,.2);animation:tin .2s;font-size:14px}
.toast.ok{background:#2e7d4f}.toast.warn{background:#9a5b00}.toast.err{background:#a61f31}.toast.info{background:var(--brand-dk)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* หน้าเข้าใช้งาน */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--brand-dk) 0%,var(--brand) 60%,#8a6f8f 100%)}
.login .box{background:#fff;border-radius:8px;padding:22px;width:min(440px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25);border-top:5px solid var(--pink)}
.login-hd{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.login-hd .mark{font-size:14px;padding:4px 8px}
.qfull{color:#b91c1c;font-weight:700}.photos{display:flex;flex-wrap:wrap;gap:8px}.photos .ph{position:relative}.photos img{width:120px;height:120px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:#f1f5f9}.photos .phdel{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(15,23,42,.7);color:#fff;cursor:pointer}.contact{margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(100,116,139,.06);line-height:1.7}.contact a{font-weight:600}.tbl tr.grp td{background:rgba(100,116,139,.13)}
.kpilist{list-style:none;padding:0;margin:0}.kpilist li{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px dashed rgba(100,116,139,.25)}.kpilist .rk{width:22px;color:#64748b;flex:none}.kpilist .v{margin-left:auto;white-space:nowrap}.kpiday{margin:10px 0 14px}.kpiday h3{margin:0 0 4px}
.pies{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:6px 0 18px}.pies svg{flex:none}.pielg{list-style:none;padding:0;margin:0;flex:1;min-width:230px}.pielg li{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px dashed rgba(100,116,139,.25)}.pielg .dot{width:12px;height:12px;border-radius:3px;flex:none;align-self:center}.pielg .v{margin-left:auto;white-space:nowrap}.minipies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:6px 0 18px}.minipie{text-align:center}.minipie .t{font-size:13px;font-weight:600;margin-top:4px}.amtrow{display:flex;gap:8px;align-items:center;margin-top:6px}.amtrow label{min-width:96px;font-weight:600;margin:0}.amtrow input{flex:1;min-width:0}
.login-logo{display:block;width:min(240px,75%);height:auto;margin:0 auto 12px}
.login-logo+.login-hd{justify-content:center;text-align:center}
header.top .logo img{height:32px;width:auto;background:#fff;border-radius:4px;padding:1px 2px;display:block}
.login h1{margin:0;font-size:18px}
.lsteps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 14px}

<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
'use strict';
/* =====================================================================
 * 1) ค่าคงที่ + ตัวช่วยทั่วไป
 * ===================================================================== */
const DATA_SHEETS = ['Cases','SA_Results','LA_Results','BloodParasite_Cattle','TestKitLog','SupplyLog','LabBooking'];
const ST = { PENDING:'รอตรวจ', WORKING:'กำลังตรวจ', REVIEW:'รอตรวจสอบ', VERIFIED:'ตรวจสอบแล้ว', REVISE:'ต้องแก้ไข' };
const ST_ORDER = [ST.PENDING, ST.WORKING, ST.REVIEW, ST.VERIFIED, ST.REVISE];
const ST_CLASS = { [ST.PENDING]:'pending', [ST.WORKING]:'working', [ST.REVIEW]:'review', [ST.VERIFIED]:'verified', [ST.REVISE]:'revise' };
const ST_ICON = { [ST.PENDING]:'○', [ST.WORKING]:'◐', [ST.REVIEW]:'◔', [ST.VERIFIED]:'✓', [ST.REVISE]:'!' };
const ROLE_TH = { member:'สมาชิก', labpath:'Lab-path', admin:'Admin' };

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
const todayStr = () => new Date().toLocaleDateString('sv-SE'); // yyyy-mm-dd ตามเวลาเครื่อง
const isDel = r => r && (r.deleted === true || String(r.deleted).toUpperCase() === 'TRUE');
const splitMulti = v => String(v ?? '').split(/\s*;\s*/).filter(Boolean);
const fmtTime = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? String(iso) : d.toLocaleString('th-TH', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); };
const fmtClock = ms => ms ? new Date(ms).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) : '-';

/** localStorage แบบปลอดภัย (โหมดส่วนตัว/พื้นที่เต็ม จะไม่ทำให้แอปพัง) */
const store = {
  get(k, d) { try { const v = localStorage.getItem('lp_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lp_' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem('lp_' + k); } catch (e) {} }
};

/* =====================================================================
 * 2) State กลาง
 * ===================================================================== */
const S = {
  session: store.get('session', null),   // {user, pin, role, unit, group}
  settings: [], cfg: {}, units: [], lists: {}, campDates: {}, kits: [], supplies: [],
  data: {}, since: 0, epoch: '', lastSync: 0,
  queue: store.get('queue', []),          // คิวรอส่ง
  online: navigator.onLine, syncing: false, flushing: null,
  conflicts: [], viewDay: null
};
DATA_SHEETS.forEach(n => S.data[n] = []);

function loadCache() {
  const c = store.get('cache', null);
  if (!c) return;
  DATA_SHEETS.forEach(n => S.data[n] = (c.data && c.data[n]) || []);
  S.since = c.since || 0; S.epoch = c.epoch || ''; S.lastSync = c.lastSync || 0;
  if (c.settings) applySettings(c.settings);
}
let cacheTimer = null;
function saveCache() {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    const ok = store.set('cache', { data: S.data, since: S.since, epoch: S.epoch, lastSync: S.lastSync, settings: S.settings });
    if (!ok) console.warn('บันทึกแคชไม่สำเร็จ (พื้นที่เต็ม?)');
  }, 300);
}
const saveQueue = () => { store.set('queue', S.queue); renderStatus(); };

/** แปลงแถวจากชีต Settings → โครงสร้างที่ใช้ง่าย */
function applySettings(rows) {
  S.settings = rows || [];
  S.cfg = {}; S.units = []; S.lists = {}; S.campDates = {}; S.kits = []; S.supplies = []; S.members = [];
  const sorted = [...S.settings].sort((a, b) => (Number(a.sort) || 0) - (Number(b.sort) || 0));
  sorted.forEach(r => {
    if (String(r.active).toUpperCase() === 'FALSE') return;
    const k = String(r.key ?? '');
    switch (r.category) {
      case 'config': S.cfg[k] = r.value; break;
      case 'campDate': S.campDates[k] = String(r.value || ''); break;
      case 'unit': { // value เช่น "LA|โคนม" = กลุ่มสัตว์ | ชนิดสัตว์ตั้งต้น
        const [g, sp] = String(r.value || 'SA').split('|');
        S.units.push({ code: k, name: r.label || k, group: (g || 'SA').trim(), species: (sp || '').trim() }); break;
      }
      case 'member': S.members.push({ name: k, group: String(r.value ?? '') }); break; // รายชื่อนิสิต (ไม่บังคับ)
      case 'kit': S.kits.push({ name: k, stock: Number(r.value) || 0 }); break;
      case 'supply': S.supplies.push({ name: k, stock: Number(r.value) || 0 }); break;
      case 'list': (S.lists[k] = S.lists[k] || []).push(String(r.label ?? r.value)); break;
    }
  });
  if (!S.lists.serum_color) S.lists.serum_color = ['สีใสไม่มีสี หรือเหลืองอ่อนใส', 'สีเหลืองเข้มขึ้น', 'สีชมพูถึงแดง', 'สีขาวขุ่นคล้ายนม']; // สี plasma (ถ้า Settings ยังไม่มี)
  // ตัวเลือกผล Blood parasite โค (ในเคสรายตัว) ต้องมีครบทุกเชื้อของตารางความชุก
  try {
    const L = S.lists.bp_result_LA;
    if (L) {
      const low = L.map(x => x.toLowerCase());
      const add = PATHO.filter(p => !low.some(x => x.startsWith(pathoKey(p)))).map(p => p.name);
      const i = L.indexOf('อื่น ๆ'); L.splice(i < 0 ? L.length : i, 0, ...add);
    }
  } catch (e) { /* PATHO ยังไม่พร้อมตอนโหลดครั้งแรก */ }
}
const campDays = () => { const n = Number(S.cfg.campDays) || Object.keys(S.campDates).length || 5; return Array.from({length: n}, (_, i) => i + 1); };
const groupList = () => Array.from({ length: Number(S.cfg.groupCount) || 14 }, (_, i) => String(i + 1));
const unitInfo = code => S.units.find(u => u.code === code) || {};
/** ตัวเลือก "หน่วย" สำหรับตัวกรอง: หน่วยโคทุกหน่วย รวมเป็น LA — สัตว์ใหญ่ (Large animal) ช่องเดียว */
function unitFilterOpts(sel) {
  let laDone = false;
  return S.units.map(u => {
    if (u.group === 'LA') { if (laDone) return ''; laDone = true; return `<option value="LA" ${sel === 'LA' ? 'selected' : ''}>LA — สัตว์ใหญ่ (Large animal)</option>`; }
    return `<option value="${esc(u.code)}" ${u.code === sel ? 'selected' : ''}>${esc(u.code)} — ${esc(u.name)}</option>`;
  }).join('');
}
/** เคสตรงกับตัวกรองหน่วยไหม (LA = เคสโค/สัตว์ใหญ่ทุกหน่วย) */
const unitMatch = (c, f) => !f || (f === 'LA' ? (c.animalGroup === 'LA' || unitInfo(c.unit).group === 'LA') : c.unit === f);
/** วันนี้เป็น Day อะไร (ตามวันที่ในตั้งค่า) ถ้าไม่ตรงวันค่าย → null */
const todayDay = () => { const t = todayStr(); const k = Object.keys(S.campDates).find(d => S.campDates[d] === t); return k ? Number(k) : null; };
const unitName = code => (S.units.find(u => u.code === code) || {}).name || code || '-';
const isStaff = () => S.session && (S.session.role === 'labpath' || S.session.role === 'admin');
const rows = sheet => S.data[sheet].filter(r => !isDel(r));
const getRec = (sheet, id) => S.data[sheet].find(r => r.id === id);
/** แก้ได้ถ้าเป็น Lab-path/Admin หรือเคสของหน่วยเดียวกัน หรือกลุ่มเดียวกัน (กลุ่มเวียนหน่วยทุกวัน) — ตรงกับกฎฝั่งเซิร์ฟเวอร์ */
function canEditCase(c) {
  if (!S.session || !c) return false;
  const s = S.session;
  return isStaff() || (!!s.unit && c.unit === s.unit) || (!!s.group && String(c.group || '') === String(s.group));
}

/* =====================================================================
 * 3) API — POST แบบ text/plain (ไม่เกิด CORS preflight กับ Apps Script)
 * ===================================================================== */
class NetErr extends Error { constructor(m) { super(m); this.network = true; } }
async function api(action, payload = {}, timeout = 30000) {
  const url = window.__LP_API_URL || API_URL;
  if (!url) throw new NetErr('ยังไม่ได้ตั้งค่า API_URL ใน index.html');
  const s = S.session || {};
  const body = JSON.stringify(Object.assign({ action, pin: s.pin, user: s.user, unit: s.unit, group: s.group }, payload));
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeout);
  let res, j;
  try {
    res = await (window.__lpFetch || fetch)(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, signal: ctrl.signal, redirect: 'follow' });
    j = await res.json();
  } catch (e) {
    setOnline(false);
    throw new NetErr('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
  } finally { clearTimeout(t); }
  setOnline(true);
  if (j && j.error === 'bad_pin' && action !== 'login' && S.session) {
    logout('PIN ถูกเปลี่ยนแล้ว กรุณาเข้าใช้งานใหม่ (ข้อมูลที่รอส่งยังอยู่ในเครื่อง)');
  }
  return j || { ok: false, error: 'empty' };
}
function setOnline(v) { if (S.online !== v) { S.online = v; renderStatus(); } }

/* =====================================================================
 * 4) คิวออฟไลน์ — ทุกการบันทึกเข้าคิวก่อนแล้วค่อยส่ง (online ก็ส่งทันที)
 *    item: {qid, action:create|update|remove, sheet, id, record|changes, version, force, error, message}
 * ===================================================================== */
function enqueue(item) {
  if (item.action === 'update') {
    // รวมการแก้หลายครั้งของแถวเดียวกันเป็นคำขอเดียว
    const cr = S.queue.find(q => q.action === 'create' && q.sheet === item.sheet && q.id === item.id);
    if (cr) { Object.assign(cr.record, item.changes); saveQueue(); return cr; }
    const up = S.queue.find(q => q.action === 'update' && q.sheet === item.sheet && q.id === item.id && !q.error);
    if (up) { Object.assign(up.changes, item.changes); saveQueue(); return up; }
  }
  item.qid = uuid(); item.at = Date.now();
  S.queue.push(item); saveQueue();
  return item;
}
const hasPending = (sheet, id) => S.queue.some(q => q.sheet === sheet && q.id === id);

/** ส่งคิวทีละรายการตามลำดับ หยุดเมื่อเน็ตหลุด */
function flushQueue() {
  if (S.flushing) return S.flushing;
  const run = async () => {
    await null; // ให้ S.flushing ถูกตั้งค่าก่อนเริ่มทำงานจริง
    const blocked = new Set(), tried = new Set();
    try {
      for (;;) {
        // หยิบรายการถัดไปที่ยังไม่ติดปัญหา (รวมรายการที่เพิ่งเข้าคิวระหว่างส่ง)
        S.queue.filter(x => x.error).forEach(x => blocked.add(x.id));
        const q = S.queue.find(x => !x.error && !blocked.has(x.id) && !tried.has(x.qid));
        if (!q) break;
        tried.add(q.qid);
        let r;
        try {
          if (q.action === 'create') r = await api('create', { sheet: q.sheet, record: q.record, force: !!q.force });
          else if (q.action === 'update') r = await api('update', { sheet: q.sheet, id: q.id, version: q.version, changes: q.changes });
          else if (q.action === 'remove') r = await api('remove', { sheet: q.sheet, id: q.id, version: q.version });
        } catch (e) { if (e.network) break; throw e; }
        if (r.ok && r.existed && q.action === 'create' && /_Results$/.test(q.sheet)) {
          // อีกเครื่องสร้างแถวผลของเคสนี้ไปก่อน → ห้ามทิ้งค่าของเรา: ให้ผู้ใช้เลือกทีละช่อง
          dropQ(q);
          upsertLocal(q.sheet, r.record, true);
          const ch = {}; Object.keys(q.record).forEach(k => { if (!['id', 'caseId', 'examNo'].includes(k) && String(q.record[k] ?? '') !== '') ch[k] = q.record[k]; });
          q.conflicted = true;
          openConflict(Object.assign({}, q, { action: 'update', changes: ch }), r.record);
        } else if (r.ok) {
          dropQ(q);
          if (r.record) upsertLocal(q.sheet, r.record, true);
          q.result = r;
        } else if (r.conflict) {
          q.conflicted = true;
          dropQ(q);
          upsertLocal(q.sheet, r.server, true);
          openConflict(q, r.server);
        } else if (r.error === 'busy') {
          break;
        } else {
          q.error = r.error; q.message = r.message || r.error; q.existing = r.existing || null;
          blocked.add(q.id); saveQueue();
          if (!q.silent) toast('ส่งไม่สำเร็จ: ' + q.message, 'err', 6000);
        }
      }
    } finally {
      S.flushing = null; saveCache(); renderStatus(); refreshView();
    }
  };
  S.flushing = run();
  return S.flushing;
}
function dropQ(q) { S.queue = S.queue.filter(x => x.qid !== q.qid); saveQueue(); }

/** ใส่/แทนแถวในข้อมูลเครื่อง (server=true → ข้อมูลจากเซิร์ฟเวอร์) */
function upsertLocal(sheet, rec, server) {
  const arr = S.data[sheet];
  if (server && isDel(rec)) { // ถูกลบออกจากชีตแล้ว → เอาออกจากเครื่องด้วย (ลบเคส = ลบผลแลปของเคสนั้นด้วย)
    S.data[sheet] = arr.filter(r => r.id !== rec.id);
    if (sheet === 'Cases') ['SA_Results', 'LA_Results'].forEach(n => { if (S.data[n]) S.data[n] = S.data[n].filter(r => r.caseId !== rec.id); });
    saveCache(); return;
  }
  const i = arr.findIndex(r => r.id === rec.id);
  if (server) rec = Object.assign({}, rec); // ลบสถานะ _pending
  if (i >= 0) arr[i] = Object.assign(server ? {} : arr[i], rec); else arr.push(rec);
  saveCache();
}

/**
 * บันทึกข้อมูล (สร้าง/แก้) → แสดงผลในเครื่องทันที แล้วส่งขึ้นเซิร์ฟเวอร์
 * คืนค่า { q, rec, sent } (sent = ส่งถึงเซิร์ฟเวอร์แล้ว)
 */
async function saveRecord(sheet, id, values, { isNew = false, force = false, silent = false } = {}) {
  const me = S.session.user, now = new Date().toISOString();
  let q;
  if (isNew) {
    const rec = Object.assign({ id, version: 1, createdAt: now, createdBy: me, updatedAt: now, updatedBy: me, deleted: false, _pending: true }, values);
    upsertLocal(sheet, rec);
    q = enqueue({ action: 'create', sheet, id, record: Object.assign({ id }, values), force, silent });
  } else {
    const cur = getRec(sheet, id);
    q = enqueue({ action: 'update', sheet, id, version: cur.version, changes: Object.assign({}, values), silent });
    Object.assign(cur, values, { _pending: true, updatedAt: now, updatedBy: me });
    saveCache();
  }
  await Promise.race([flushQueue(), new Promise(r => setTimeout(r, 15000))]);
  const stillQueued = S.queue.find(x => x.qid === q.qid);
  return { q: stillQueued || q, rec: getRec(sheet, id), sent: !stillQueued && !q.conflicted, conflict: !!q.conflicted,
    error: stillQueued && stillQueued.error ? stillQueued : null };
}
/** toast มาตรฐานหลังบันทึก: บันทึกแล้ว / รอส่ง / ชน / ผิดพลาด */
function saveToast(r, okMsg = 'บันทึกแล้ว') {
  if (r.conflict) toast('ข้อมูลถูกแก้โดยคนอื่น — กรุณาเลือกค่าที่จะใช้', 'warn', 5000);
  else if (r.error) toast('บันทึกไม่สำเร็จ: ' + r.error.message, 'err', 6000);
  else if (r.sent) toast(okMsg, 'ok');
  else toast('บันทึกไว้ในเครื่อง รอส่ง', 'warn');
}
async function removeRecord(sheet, id) {
  const cur = getRec(sheet, id);
  if (cur && cur._pending && S.queue.some(q => q.action === 'create' && q.id === id)) {
    // ยังไม่เคยส่งขึ้นเซิร์ฟเวอร์ → ลบในเครื่องได้เลย
    S.queue = S.queue.filter(q => q.id !== id); saveQueue();
    S.data[sheet] = S.data[sheet].filter(r => r.id !== id); saveCache();
    return { sent: true };
  }
  const q = enqueue({ action: 'remove', sheet, id, version: cur ? cur.version : '' });
  if (cur) { cur.deleted = true; cur._pending = true; }
  saveCache();
  await flushQueue();
  return { sent: !S.queue.includes(q) };
}

/** ข้อมูลที่ยังรอส่ง → ทับลงบนข้อมูลที่โหลดใหม่ ให้ผู้ใช้ยังเห็นสิ่งที่ตัวเองกรอก */
function applyPendingOverlay() {
  S.queue.forEach(q => {
    const arr = S.data[q.sheet]; if (!arr) return;
    let cur = arr.find(r => r.id === q.id);
    if (q.action === 'create' && !cur) { arr.push(Object.assign({ id: q.id, version: 1, createdBy: S.session.user, createdAt: new Date(q.at).toISOString(), _pending: true }, q.record)); }
    else if (q.action === 'update' && cur) Object.assign(cur, q.changes, { _pending: true });
    else if (q.action === 'remove' && cur) Object.assign(cur, { deleted: true, _pending: true });
  });
}

/* =====================================================================
 * 5) Sync — polling ทุก 20–30 วินาที ดึงเฉพาะแถวที่เปลี่ยน
 * ===================================================================== */
async function sync(full = false) {
  if (!S.session || S.syncing) return;
  if (S.session.day !== todayStr()) return logout('เริ่มวันใหม่ — กรุณายืนยันชื่อและหน่วยที่ปฏิบัติงานวันนี้', true);
  S.syncing = true; renderStatus();
  let changed = false;
  try {
    await flushQueue();
    const r = await api(full || !S.since ? 'all' : 'changes', { since: S.since });
    if (!r.ok) return;
    if (!r.full && S.epoch && r.epoch && r.epoch !== S.epoch) { S.syncing = false; return sync(true); } // Admin ล้างข้อมูล → โหลดใหม่
    if (r.full) {
      DATA_SHEETS.forEach(n => S.data[n] = r.data[n] || []);
      applyPendingOverlay(); changed = true;
    } else {
      Object.keys(r.data || {}).forEach(sheet => {
        (r.data[sheet] || []).forEach(row => {
          const cur = getRec(sheet, row.id);
          if (hasPending(sheet, row.id)) return;            // กำลังมีการแก้ในเครื่อง → ไม่ทับ (ถ้าชนจะขึ้นหน้าต่างเลือก)
          if (cur && Number(cur.version) > Number(row.version)) return;
          if (cur && Number(cur.version) === Number(row.version) && !cur._pending) return;
          upsertLocal(sheet, row, true); changed = true;
        });
      });
    }
    if (r.settings) { applySettings(r.settings); changed = true; }
    S.since = r.serverTime; S.epoch = r.epoch || S.epoch; S.lastSync = Date.now();
    saveCache();
  } catch (e) {
    if (!e.network) console.error(e);
  } finally {
    S.syncing = false; renderStatus();
    if (changed) refreshView(true);
  }
}
let pollTimer = null, retryTimer = null;
function startPolling() {
  clearInterval(pollTimer); clearInterval(retryTimer);
  const sec = Math.min(60, Math.max(15, Number(S.cfg.pollSeconds) || 25));
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible') sync(); }, sec * 1000);
  retryTimer = setInterval(() => { if (S.queue.some(q => !q.error)) flushQueue(); }, 30000); // ส่งซ้ำทุก 30 วินาที
}
window.addEventListener('online', () => { setOnline(true); toast('กลับมาออนไลน์ กำลังส่งข้อมูล…', 'info'); sync(); });
window.addEventListener('offline', () => { setOnline(false); toast('ออฟไลน์ — กรอกต่อได้ ระบบจะส่งให้เมื่อมีเน็ต', 'warn'); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.session) sync(); });

/* =====================================================================
 * 6) UI พื้นฐาน: toast, modal, สถานะการเชื่อมต่อ
 * ===================================================================== */
function toast(msg, type = 'ok', ms = 3200) {
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg; el.setAttribute('role', 'status');
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}
/** modal: คืน Promise ค่าที่ปุ่มส่งมา (data-v) หรือ null เมื่อปิด */
function modal(html, { onMount, wide } = {}) {
  return new Promise(resolve => {
    const root = $('#modalRoot');
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `<div class="box" role="dialog" aria-modal="true" ${wide ? 'style="max-width:960px"' : ''}>${html}</div>`;
    root.appendChild(wrap);
    const close = v => { wrap.remove(); resolve(v); };
    wrap.addEventListener('click', e => {
      if (e.target === wrap) return close(null);
      const b = e.target.closest('[data-v]');
      if (b) close(b.dataset.v === 'null' ? null : (b.dataset.collect ? collect(wrap) : b.dataset.v));
    });
    const collect = w => { const o = {}; $$('[name]', w).forEach(i => { if (i.type === 'radio') { if (i.checked) o[i.name] = i.value; } else o[i.name] = i.value; }); return o; };
    if (onMount) onMount(wrap.firstChild, close);
    const f = $('input,textarea,select,button.pri', wrap); if (f) setTimeout(() => f.focus(), 30);
  });
}
const confirmBox = (title, body, okText = 'ยืนยัน', cls = 'pri') => modal(
  `<h2>${esc(title)}</h2><div>${body}</div><div class="acts"><button class="btn" data-v="null">ยกเลิก</button><button class="btn ${cls}" data-v="1">${esc(okText)}</button></div>`
).then(v => v === '1');

function statusBadge(s) { return `<span class="badge st-${ST_CLASS[s] || 'pending'}">${ST_ICON[s] || '○'} ${esc(s || ST.PENDING)}</span>`; }

function renderStatus() {
  const el = $('#connPill'); if (!el) return;
  const bad = S.queue.filter(q => q.error).length, waiting = S.queue.length - bad;
  let cls, txt;
  if (bad) { cls = 'bad'; txt = `⚠ มีปัญหา ${bad} รายการ`; }
  else if (waiting) { cls = 'q'; txt = `⏳ รอส่ง ${waiting} รายการ`; }
  else if (!S.online) { cls = 'off'; txt = 'ออฟไลน์'; }
  else { cls = 'on'; txt = S.syncing ? 'กำลังซิงก์…' : 'ออนไลน์'; }
  el.className = 'pill ' + cls;
  el.innerHTML = `<span class="dot"></span>${txt}`;
  el.title = 'ซิงก์ล่าสุด ' + fmtClock(S.lastSync) + ' — กดเพื่อดูรายละเอียด';
}

/** หน้าต่างคิวรอส่ง: ดู/ลองใหม่/ทิ้ง */
function openQueuePanel() {
  const label = q => {
    const r = q.record || getRec(q.sheet, q.id) || {};
    return `${esc({create:'สร้าง',update:'แก้ไข',remove:'ลบ'}[q.action])} ${esc(q.sheet)} — ${esc(r.sampleNo || r.animalName || r.animalId || r.item || q.id.slice(0, 8))}`;
  };
  const html = `<h2>สถานะการส่งข้อมูล</h2>
    <p class="muted small">${S.online ? 'ออนไลน์' : 'ออฟไลน์'} · ซิงก์ล่าสุด ${fmtClock(S.lastSync)} · ข้อมูลในเครื่อง ${rows('Cases').length} เคส</p>
    ${S.queue.length ? `<table class="tbl"><tbody>${S.queue.map(q => `<tr><td>${label(q)}<div class="small ${q.error ? '' : 'muted'}" style="${q.error ? 'color:var(--err)' : ''}">${q.error ? esc(q.message) : 'รอส่ง · ' + fmtTime(new Date(q.at).toISOString())}</div></td>
      <td class="n" style="white-space:nowrap">${q.error ? `<button class="btn" data-retry="${q.qid}">${q.error === 'duplicate' ? 'ยืนยันสร้างซ้ำ' : 'ลองใหม่'}</button> ` : ''}<button class="btn danger" data-drop="${q.qid}">ทิ้ง</button></td></tr>`).join('')}</tbody></table>`
      : '<div class="alert ok">ส่งข้อมูลครบแล้ว ไม่มีรายการค้าง</div>'}
    <div class="acts"><button class="btn" data-v="sync">ซิงก์ตอนนี้</button><button class="btn pri" data-v="null">ปิด</button></div>`;
  modal(html, { onMount(box, close) {
    box.addEventListener('click', async e => {
      const rt = e.target.closest('[data-retry]'), dp = e.target.closest('[data-drop]');
      if (rt) { const q = S.queue.find(x => x.qid === rt.dataset.retry); if (q) { if (q.error === 'duplicate') q.force = true; q.error = null; q.message = ''; saveQueue(); } close(null); await flushQueue(); openQueuePanel(); }
      if (dp) {
        const q = S.queue.find(x => x.qid === dp.dataset.drop); if (!q) return;
        if (!await confirmBox('ทิ้งรายการนี้?', 'ข้อมูลที่ยังไม่ได้ส่งของรายการนี้จะหายไป')) return;
        dropQ(q);
        if (q.action === 'create') S.data[q.sheet] = S.data[q.sheet].filter(r => r.id !== q.id);
        close(null); sync(true);
      }
    });
  } }).then(v => { if (v === 'sync') sync(); });
}

/* =====================================================================
 * 7) Conflict — ห้ามเขียนทับเงียบ ๆ: ให้ผู้ใช้เลือกทีละช่อง
 * ===================================================================== */
function openConflict(q, server) {
  S.conflicts.push({ q, server });
  if (S.conflicts.length === 1) nextConflict();
}
function nextConflict() {
  const c = S.conflicts[0]; if (!c) return;
  const { q, server } = c;
  const mine = q.changes || {};
  const keys = Object.keys(mine).filter(k => String(mine[k] ?? '') !== String(server[k] ?? ''));
  const done = () => { S.conflicts.shift(); refreshView(true); nextConflict(); };
  if (!keys.length || isDel(server)) {
    toast(isDel(server) ? 'ข้อมูลนี้ถูกลบโดยคนอื่นแล้ว' : 'ข้อมูลของคุณตรงกับฉบับล่าสุดอยู่แล้ว', 'info');
    return done();
  }
  const html = `<h2>⚠ ข้อมูลถูกแก้โดยคนอื่น</h2>
    <p><b>${esc(server.sampleNo || server.animalName || '')}</b> ถูกแก้โดย <b>${esc(server.updatedBy)}</b> เมื่อ ${fmtTime(server.updatedAt)} ระหว่างที่คุณกำลังแก้
    — เลือกว่าจะใช้ค่าไหนในแต่ละช่อง</p>
    <div class="tblwrap"><table class="tbl diff"><thead><tr><th>ช่อง</th><th>ของคุณ</th><th>ล่าสุดในระบบ (${esc(server.updatedBy)})</th></tr></thead><tbody>
    ${keys.map(k => `<tr><td><b>${esc(fieldLabel(k))}</b></td>
      <td class="mine"><label><input type="radio" name="${esc(k)}" value="mine"> <span>${esc(mine[k]) || '<i class=muted>(ว่าง)</i>'}</span></label></td>
      <td class="srv"><label><input type="radio" name="${esc(k)}" value="server" checked> <span>${esc(server[k]) || '<i class=muted>(ว่าง)</i>'}</span></label></td></tr>`).join('')}
    </tbody></table></div>
    <div class="acts"><button class="btn" data-v="server">ใช้ของระบบทั้งหมด</button><button class="btn pri" data-v="pick" data-collect="1">บันทึกตามที่เลือก</button></div>`;
  modal(html, { wide: true }).then(async v => {
    if (v && typeof v === 'object') {
      const ch = {}; keys.forEach(k => { if (v[k] === 'mine') ch[k] = mine[k]; });
      if (Object.keys(ch).length) {
        enqueue({ action: 'update', sheet: q.sheet, id: q.id, version: server.version, changes: ch });
        Object.assign(getRec(q.sheet, q.id), ch, { _pending: true });
        flushQueue();
        toast('กำลังบันทึกค่าที่เลือก', 'info');
      }
    } else toast('ใช้ข้อมูลล่าสุดในระบบ', 'info');
    done();
  });
}

const photoIds = v => splitMulti(v).filter(x => /^[\w-]{10,}$/.test(x));
function photoThumbs(val, ro) {
  const ids = photoIds(val);
  if (!ids.length) return ro ? '<span class="small muted">ไม่มีรูป</span>' : '';
  return ids.map(id => `<div class="ph"><a href="https://drive.google.com/file/d/${esc(id)}/view" target="_blank" rel="noopener"><img src="https://drive.google.com/thumbnail?id=${esc(id)}&sz=w400" alt="รูปผล" loading="lazy"></a>${ro ? '' : `<button type="button" class="phdel" data-photo-del="${esc(id)}" aria-label="เอารูปนี้ออก">✕</button>`}</div>`).join('');

/** ย่อรูปก่อนอัปโหลด (ด้านยาวสุด 1600 px · JPEG) → base64 */
function shrinkImage(file, max = 1600, q = 0.8) {
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', q).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('อ่านไฟล์รูปไม่ได้')); };
    img.src = url;
  });
}

function readForm(root, fields) {
  const o = {};
  fields.forEach(f => {
    if (f.type === 'amounts') { // ปริมาณแยกตามชนิดตัวอย่าง → "Blood: 1 ml; Fecal: 5 g"
      if (!$('#amtBox', root)) return;
      o[f.k] = $$('[data-amt]', root).filter(i => i.value.trim()).map(i => i.dataset.amt + ': ' + i.value.trim().replace(/;/g, ',')).join('; ');
      return;
    }
    const box = $(`[data-chips="${f.k}"]`, root);
    if (box) {
      const v = $$('input:checked', box).map(i => i.value);
      o[f.k] = f.type === 'multi' ? v.join('; ') : (f.type === 'day' ? (v[0] ? Number(v[0]) : '') : (v[0] || ''));
      return;
    }
    const el = $(`[name="${f.k}"]`, root);
    if (!el) return;
    let v = el.value.trim();
    if (f.type === 'num' && v !== '') { const n = Number(v.replace(/,/g, '')); v = isFinite(n) ? n : v; }
    o[f.k] = v;
  });
  return o;
}
/** ตรวจช่องบังคับ + ตัวเลข → คืนรายการ error */
function validateForm(root, fields, vals) {
  $$('.fld.invalid', root).forEach(e => { e.classList.remove('invalid'); const m = $('.err-msg', e); if (m) m.remove(); });
  const errs = [];
  fields.forEach(f => {
    let msg = '';
    if (f.type === 'amounts') {
      const ts = splitMulti(vals.sampleTypes), a = parseAmounts(vals[f.k], ts), miss = ts.filter(t => !a[t]);
      if (miss.length) msg = 'กรอกปริมาณของ ' + miss.join(', ');
    }
    else if (f.req && (vals[f.k] === '' || vals[f.k] == null)) msg = 'จำเป็นต้องกรอก';
    else if (f.type === 'num' && vals[f.k] !== '' && typeof vals[f.k] !== 'number') msg = 'ต้องเป็นตัวเลข';
    if (msg) {
      errs.push(f.label + ': ' + msg);
      const el = $(`.fld[data-k="${f.k}"]`, root);
      if (el) { el.classList.add('invalid'); el.insertAdjacentHTML('beforeend', `<div class="err-msg">${msg}</div>`); }
    }
  });
  if (errs.length) { const first = $('.fld.invalid', root); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  return errs;
}

      const list = r.exact || r.suggest;
      if (r.exact && r.exact.length === 1) picked = r.exact[0];
      box.innerHTML = picked ? '' :
        list.length ? `<div class="small muted">${r.exact ? 'ชื่อนี้มีหลายคน — แตะเลือกตัวเอง' : 'หมายถึง…'}</div>` +
          list.map(m => `<button type="button" class="btn" data-pick="${esc(m.name)}">${esc(m.name)} <span class="muted">· กลุ่ม ${esc(m.group)}</span></button>`).join('')
        : `<div class="small" style="color:var(--err)">${role === 'member' ? 'ไม่พบชื่อนี้ในรายชื่อค่าย — ตรวจการสะกด หรือติดต่อฝ่าย Lab-path' : ''}</div>`;
      $$('[data-pick]', box).forEach(b => b.onclick = () => { $('#lgName').value = b.dataset.pick; check(); });
      showGroup();
    };
    $('#lgName').oninput = check; check();
    setTimeout(() => $('#lgName').focus(), 30);
  };
  $('#step1').onsubmit = async e => {
    e.preventDefault();
    const pin = $('#lgPin').value.trim();
    if (!pin) return;
    const btn = $('#step1 button'); btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ…';
    try {
      S.session = { user: '', pin, unit: '' };
      const r = await api('login');
      if (!r.ok) throw new Error(r.message || 'เข้าใช้งานไม่สำเร็จ');
      applySettings(r.settings);
      store.set('pin', pin);
      pending = { pin, role: r.role };
      toStep2(r.role);
    } catch (err) {
      store.del('pin');
      $('#lgErr').innerHTML = `<div class="alert err">${esc(err.network ? 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — การเข้าใช้งานต้องมีอินเทอร์เน็ต' : err.message)}</div>`;
    } finally { S.session = null; btn.disabled = false; btn.textContent = 'ถัดไป'; }
  };
  $('#lgBack').onclick = () => {
    $('#step2').classList.add('hidden'); $('#step1').classList.remove('hidden');
    $('#ls2').classList.remove('on'); $('#ls1').classList.add('on');
  };
  $('#step2').onsubmit = async e => {
    e.preventDefault();
    const typed = $('#lgName').value.trim().replace(/\s+/g, ' ');
    if (typed.length < 2) return toast('กรุณากรอกชื่อ', 'warn');
    if (pending.role === 'member' && S.members.length && !picked) return toast('ไม่พบชื่อในรายชื่อค่าย หรือชื่อซ้ำ — แตะเลือกชื่อจากรายการ', 'warn');
    const btn = $('#step2 button[type=submit]'); btn.disabled = true; btn.textContent = 'กำลังเข้าใช้งาน…';
    try {
      // ส่งชื่อเต็มตามรายชื่อ · กลุ่มเซิร์ฟเวอร์เป็นผู้กำหนดจากรายชื่อ (หน้าเว็บเปลี่ยนเองไม่ได้)
      S.session = { user: picked ? picked.name : typed, pin: pending.pin, unit: '', group: picked ? picked.group : '' };
      const r = await api('checkin', { device: deviceInfo() });
      if (!r.ok) throw new Error(r.message || 'เข้าใช้งานไม่สำเร็จ');
      S.session = { user: r.user, pin: pending.pin, role: r.role, unit: '', group: r.group || '', day: todayStr(), at: Date.now() };
      store.set('session', S.session);
      store.set('lastLogin', { user: r.user });
      startApp(true);
      toast(`เข้าใช้งานในชื่อ ${r.user}${r.group ? ' · กลุ่ม ' + r.group : ''}`, 'ok');
    } catch (err) {
      S.session = null;
      $('#lgErr2').innerHTML = `<div class="alert err">${esc(err.network ? 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — การเข้าใช้งานต้องมีอินเทอร์เน็ต' : err.message)}</div>`;
    } finally { btn.disabled = false; btn.textContent = 'เข้าใช้งาน'; }
  };
  // หมดอายุรายวัน: มี PIN ในเครื่องแล้ว → ข้ามไปขั้นเลือกชื่อ + กลุ่มเลย
  if (savedPin && msg && (window.__LP_API_URL || API_URL)) $('#step1').requestSubmit();
}

async function switchGroup() {

function caseItem(c) {
  const name = c.animalGroup === 'LA'
    ? [c.animalId, c.animalName].filter(Boolean).join(' · ') || '(ไม่มีชื่อ/ear tag)'
    : c.animalName || '(ไม่มีชื่อ)';
  const sub = [c.species, c.animalGroup === 'LA' ? c.farmName : '', c.ownerName, `${c.unit || ''}${c.group ? ' กลุ่ม ' + c.group : ''}`, 'Day ' + (c.campDay || '-')].filter(Boolean).join(' · ');
  return `<a class="citem" href="#/case/${encodeURIComponent(c.id)}">
    <div class="sn mono">${c.sampleNo ? esc(c.sampleNo) : '<span class="badge pend">รอเลข</span>'}</div>
    <div class="main"><div class="nm">${esc(name)}</div><div class="sub">${esc(sub)}</div><div class="tchips">${testChips(c)}</div></div>
    <div>${statusBadge(c.status)}${c._pending ? ' <span class="badge pend" title="ยังไม่ได้ส่งขึ้นเซิร์ฟเวอร์">⏳</span>' : ''}</div></a>`;
}
/** ป้ายการตรวจของเคส: ✓ มีผล (ชมพู = พบ/Positive), ○ ส่งตรวจแต่ยังไม่ลงผล */
function testChips(c) {
  const g = c.animalGroup === 'LA' ? 'LA' : 'SA', row = resultRow(c);
  const ks = [...new Set(requestedTests(c).concat(testsFor(g).map(t => t.k).filter(k => hasData(g, k, row))))];
  return ks.map(k => {
    const t = TESTS.find(x => x.k === k), d = hasData(g, k, row), p = d && isPositive(g, k, row);
    return `<span class="tchip ${d ? (p ? 'p' : 'd') : ''}">${d ? '✓' : '○'} ${esc(t.short)}</span>`;
  }).join('');
}
function countBy(list) { const o = { all: list.length }; ST_ORDER.forEach(s => o[s] = list.filter(c => (c.status || ST.PENDING) === s).length); return o; }

function VIEWS_new(el, mode, fromId) {

    return { animalGroup: u.group === 'LA' ? 'LA' : 'SA', species: u.species || '', ageUnit: 'ปี', campDay: day, unit: pu, group: s.group, recorder: s.user,

      subdistrict: S.cfg.defaultSubdistrict || '', district: S.cfg.defaultDistrict || '', province: S.cfg.defaultProvince || '' };
  };
  let st = store.get('draft_new', null) || blank();
  let restored = !!store.get('draft_new', null);
  // "สร้างเคสต่อในบ้าน/ฟาร์มเดียวกัน" — คัดลอกข้อมูลเจ้าของ
  if (mode === 'same' && fromId) {

    if (src) {
      st = blank();
      ['campDay', 'unit', 'group', 'animalGroup', ...FIELDS.owner.map(f => f.k), 'farmName', 'farmNo'].forEach(k => st[k] = src[k] ?? '');
      if (src.animalGroup === 'LA') { st.species = src.species; st.breed = src.breed; }
      st.queueNo = '';
      st.recorder = s.user; restored = false;
      history.replaceState(null, '', '#/new');
    }
  }
  const draw = () => {
    el.innerHTML = `
      <div class="row" style="justify-content:space-between"><h1 style="margin:0">รับตัวอย่าง</h1>
        <button class="btn" id="clearBtn" type="button">ล้างฟอร์ม</button></div>
      <p class="muted small" style="margin-top:4px">ช่องที่มี <span class="req">*</span> จำเป็นต้องกรอก · ระบบออกเลขตัวอย่างให้อัตโนมัติ · ฟอร์มบันทึกร่างไว้ในเครื่องระหว่างพิมพ์</p>
      ${restored ? '<div class="alert info small">กู้คืนฉบับร่างที่ยังไม่ได้บันทึก</div>' : ''}
      <form id="newForm" novalidate>${caseFormHTML(st, false)}
        <div class="formbar"><button class="btn pri big" type="submit" style="flex:1">💾 บันทึก + ออกเลขตัวอย่าง</button></div>
      </form>`;
    const form = $('#newForm', el);
    bindCaseForm(form, () => st, ns => { st = ns; store.set('draft_new', st); restored = false; draw(); });
    form.addEventListener('input', () => { st = Object.assign(st, readForm(form, caseFields(st.animalGroup))); store.set('draft_new', st); });
    form.addEventListener('change', () => { st = Object.assign(st, readForm(form, caseFields(st.animalGroup))); store.set('draft_new', st); });
    $('#clearBtn', el).onclick = async () => { if (await confirmBox('ล้างฟอร์ม?', 'ข้อมูลที่กรอกไว้จะหายไป')) { store.del('draft_new'); st = blank(); restored = false; draw(); } };
    form.onsubmit = async e => { e.preventDefault(); submit(form); };
  };
  const submit = async form => {
    const fields = caseFields(st.animalGroup);
    const vals = cattleTests(Object.assign(readForm(form, fields), { animalGroup: st.animalGroup }));
    if (!isStaff()) vals.group = s.group; // สมาชิก: ติดกลุ่มของผู้บันทึก (เซิร์ฟเวอร์บังคับซ้ำอีกชั้น)
    setPrefUnit(vals.unit);
    if (validateForm(form, fields, vals).length) return toast('กรุณากรอกช่องที่จำเป็นให้ครบ', 'err');
    const qm = quotaBlock(vals, null); if (qm) return toast(qm, 'err', 7000);
    vals.date = S.campDates[vals.campDay] || todayStr();
    // เตือนเคสซ้ำ (ชื่อสัตว์ + เจ้าของ + วันเดียวกัน)
    let force = false;
    const norm = x => String(x || '').replace(/\s+/g, '').toLowerCase();
    const dup = vals.animalName && vals.ownerName && rows('Cases').find(c => norm(c.animalName) === norm(vals.animalName) && norm(c.ownerName) === norm(vals.ownerName) && String(c.date) === vals.date);
    if (dup) {
      if (!await confirmBox('อาจเป็นเคสซ้ำ', `มีเคส <b>${esc(dup.animalName)}</b> ของ ${esc(dup.ownerName)} ในวันนี้แล้ว (${esc(dup.sampleNo || 'รอเลข')})<br>ต้องการลงทะเบียนเพิ่มอีกเคสหรือไม่?`, 'ลงทะเบียนเพิ่ม', 'warn')) return;
      force = true;
    }
    const btn = $('button[type=submit]', form); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    const id = uuid();
    let res = await saveRecord('Cases', id, vals, { isNew: true, force, silent: true });
    if (res.error && res.error.error === 'duplicate') {
      const ex = res.error.existing || {};
      if (await confirmBox('มีเคสนี้ในระบบแล้ว', `เคส ${esc(ex.sampleNo || '')} ${esc(ex.animalName || '')} ของ ${esc(ex.ownerName || '')} ถูกลงทะเบียนโดย ${esc(ex.createdBy || '')}<br>ยืนยันลงทะเบียนเพิ่ม?`, 'ลงทะเบียนเพิ่ม', 'warn')) {
        res.error.error = null; res.error.force = true; saveQueue();
        await flushQueue(); res = { rec: getRec('Cases', id), sent: !S.queue.some(q => q.id === id) };
      } else {
        S.queue = S.queue.filter(q => q.id !== id); saveQueue();
        S.data.Cases = S.data.Cases.filter(c => c.id !== id); saveCache();
        btn.disabled = false; btn.textContent = '💾 บันทึก + ออกเลขตัวอย่าง';
        if (ex.id) go('#/case/' + ex.id);
        return;
      }
    } else if (res.error) {
      toast('บันทึกไม่สำเร็จ: ' + res.error.message, 'err', 6000);
      S.queue = S.queue.filter(q => q.id !== id); saveQueue();
      S.data.Cases = S.data.Cases.filter(c => c.id !== id); saveCache();
      btn.disabled = false; btn.textContent = '💾 บันทึก + ออกเลขตัวอย่าง';
      return;
    }
    store.del('draft_new');
    showCreated(el, res.rec, res.sent);
  };
  draw();
};

/** ชนิดการตรวจ (แท็บ) — la:true = ใช้กับสัตว์ใหญ่ด้วย */
const TESTS = [
  { k:'blood', label:'Blood (CBC)', short:'Blood', la:true, set:'blood_setting' },
  { k:'bp', label:'Blood parasite', short:'Blood parasite', la:true, set:'bp_setting' },
  { k:'pcv', label:'PCV / สี plasma', short:'PCV/Plasma', la:true, laOnly:true, set:'pcv_setting', alias:['PCV / สี serum'] },
  { k:'feces', label:'Fecal exam', short:'Fecal', la:true, set:'fec_setting' },
  { k:'chem', label:'Blood chemistry', short:'Chemistry', la:true, set:'chem_setting' },
  { k:'cyto', label:'Cytology', short:'Cytology', la:true, set:'cyto_setting' },
  { k:'urine', label:'Urinalysis', short:'Urine', set:'ur_setting' },
  { k:'kit', label:'Test kit', short:'Test kit', set:'kit_setting' },
  { k:'derm', label:'Derm (skin/ear)', short:'Derm', set:'derm_setting' },
  { k:'ocular', label:'Ocular (STT/Fluorescein)', short:'Ocular', set:'oc_setting' },

const testsFor = g => TESTS.filter(t => g === 'LA' ? t.la : !t.laOnly);
/** PBL โค: เก็บ Blood → ตรวจ Blood parasite + PCV/hematocrit + สี plasma เสมอ (เซิร์ฟเวอร์บังคับซ้ำอีกชั้น) */
const CATTLE_BLOOD_TESTS = ['Blood parasite', 'PCV / สี plasma'];
const cattleBlood = c => c.animalGroup === 'LA' && splitMulti(c.sampleTypes).includes('Blood');
function cattleTests(v) {
  if (!cattleBlood(v)) return v;
  const t = splitMulti(v.tests).map(x => x === 'PCV / สี serum' ? 'PCV / สี plasma' : x); CATTLE_BLOOD_TESTS.forEach(x => { if (!t.includes(x)) t.push(x); });
  v.tests = t.join('; ');
  return v;
}
const testByLabel = l => TESTS.find(t => t.label === l || t.short === l || t.k === l || (t.alias || []).includes(l));
/** ถ้าไม่ได้ระบุ "ส่งตรวจ" → เดาจากชนิดตัวอย่าง */
const SAMPLE2TEST = { 'Blood':['blood','bp'], 'Fecal':['feces'], 'Urine':['urine'], 'Skin/Hair':['derm'], 'Ear swab':['derm'], 'FNA':['cyto'], 'Vaginal swab':['vag'] };
function requestedTests(c) {
  let ks = splitMulti(c.tests).map(testByLabel).filter(Boolean).map(t => t.k);
  if (!ks.length) splitMulti(c.sampleTypes).forEach(s => (SAMPLE2TEST[s] || []).forEach(k => ks.push(k)));
  if (cattleBlood(c)) ks.push('bp', 'pcv');
  return [...new Set(ks)];
}

      ...DIFF, { k:'poikilocyte', label:'Poikilocytes', type:'text' }, { k:'platelet', label:'Platelet (×10³/µL)', type:'num', ref:'plt' },
      { k:'blood_interp', label:'Interpretation', type:'area', w:'full' } ],
    chem: [ { k:'chem_setting', ...FL },
      { k:'chem_bun', label:'BUN (mg/dL)', type:'num', ref:'bun' }, { k:'chem_crea', label:'Creatinine (mg/dL)', type:'num', ref:'crea' },
      { k:'chem_ast', label:'AST (U/L)', type:'num', ref:'ast' }, { k:'chem_ggt', label:'GGT (U/L)', type:'num', ref:'ggt' },
      { k:'chem_tp', label:'Total protein (g/dL)', type:'num', ref:'tp' }, { k:'chem_alb', label:'Albumin (g/dL)', type:'num', ref:'alb' },
      { k:'chem_glob', label:'Globulin (g/dL)', type:'num', ref:'glob' }, { k:'chem_glu', label:'Glucose (mg/dL)', type:'num', ref:'glu' },
      { k:'chem_other', label:'ค่าอื่น ๆ (เช่น Ca, P, Mg, Bilirubin)', type:'text', w:'full' },
      { k:'chem_interp', label:'Blood chemistry interpretation', type:'area', w:'full' } ],
    bp: [ { k:'bp_setting', ...FL }, { k:'bp_method', label:'Methods', type:'multi', list:'bp_method_LA', w:'full' },
      { k:'bp_result', label:'ผลที่พบ', type:'multi', list:'bp_result_LA', w:'full', pos:true }, { k:'bp_note', label:'หมายเหตุ', type:'area', w:'full' } ],
    pcv: [ { k:'pcv_setting', ...FL }, { k:'pcv', label:'PCV / Hematocrit (%) — ค่าเดียวกับ Hct ในแท็บ Blood', type:'num', ref:'hct' },
      { k:'serum_color', label:'สี plasma', type:'chips', list:'serum_color', w:'full' }, { k:'pcv_note', label:'หมายเหตุ', type:'area', w:'full' } ],
    feces: [ { k:'fec_setting', ...FL }, { k:'fec_method', label:'Method', type:'multi', list:'fec_method', w:'full' },
      { k:'fec_result', label:'ผลที่พบ', type:'multi', list:'fec_result_LA', w:'full', pos:true }, { k:'fec_epg', label:'Fecal egg count (EPG)', type:'num' },
      { k:'fec_note', label:'หมายเหตุ', type:'area', w:'full' } ],
    cyto: [ { k:'cyto_setting', ...FL }, { k:'cyto_lesionType', label:'Type of lesion', type:'text' }, { k:'cyto_location', label:'Location of lesion', type:'text' },
      { k:'cyto_prep', label:'Preparation method', type:'text' }, { k:'cyto_stain', label:'Staining', type:'multi', list:'stain', w:'full' },
      { k:'cyto_results', label:'Results', type:'area', w:'full' }, { k:'cyto_note', label:'หมายเหตุ', type:'area', w:'full' } ]
  }
};
const RES_SHEET = g => g === 'LA' ? 'LA_Results' : 'SA_Results';
const secFields = (g, k) => (SECTIONS[g === 'LA' ? 'LA' : 'SA'][k] || []);

/** ค่าอ้างอิงโดยประมาณ (ใช้เตือน ↑↓ สีเหลือง ไม่บล็อกการบันทึก) — ปรับตามตำราที่ฝ่ายใช้ได้ */
const REF = {
  'สุนัข': { hct:[37,55], tp:[5.4,7.5], rbc:[5.5,8.5], wbc:[6,17], plt:[200,500], usg:[1.015,1.045],
    bun:[7,27], crea:[0.5,1.8], alt:[10,100], alp:[20,150], alb:[2.5,4.0], glob:[2.0,4.5], glu:[70,140] },
  'แมว':  { hct:[30,45], tp:[6.0,8.0], rbc:[5,10], wbc:[5.5,19.5], plt:[300,800], usg:[1.035,1.060],
    bun:[16,36], crea:[0.8,2.4], alt:[12,130], alp:[14,111], alb:[2.5,3.9], glob:[2.5,5.0], glu:[70,150] },
  'โค':   { hct:[24,46], tp:[7.0,8.5], rbc:[5,10], wbc:[4,12], plt:[100,800],
    bun:[6,27], crea:[1.0,2.0], ast:[60,125], ggt:[15,40], alb:[2.7,3.8], glob:[3.0,4.8], glu:[45,75] }
};
const refFor = c => REF[c.species] || (c.animalGroup === 'LA' ? REF['โค'] : null);
const HARD = { hct:[0,80], tp:[0,15], ur_usg:[1.000,1.080] }; // เกินช่วงนี้ = เป็นไปไม่ได้ → ห้ามบันทึก

/** แถวผลแลปของเคส (1 แถว/เคส) */
function resultRow(c) {
  return rows(RES_SHEET(c.animalGroup)).filter(r => r.caseId === c.id)
    .sort((a, b) => (Number(a.examNo) || 1) - (Number(b.examNo) || 1) || String(a.createdAt).localeCompare(String(b.createdAt)))[0] || null;
}
const filled = v => v !== '' && v !== null && v !== undefined;
function hasData(g, sec, row) {
  if (!row) return false;
  const t = TESTS.find(x => x.k === sec);
  // โค: Hct ใช้ร่วมกับ PCV → แท็บ Blood (CBC) นับว่าลงผลเมื่อมีค่าอื่นนอกจาก Hct
  return secFields(g, sec).some(f => f.k !== t.set && !(g === 'LA' && sec === 'blood' && f.k === 'hct') && filled(row[f.k]));
}
function isPositive(g, sec, row) {
  if (!row) return false;
  const neg = v => !filled(v) || splitMulti(v).every(x => x === 'ไม่พบ');
  if (sec === 'bp') return !neg(row.bp_result);
  if (sec === 'feces') return !neg(row.fec_result);
  if (sec === 'kit') return secFields(g, 'kit').some(f => row[f.k] === 'Positive');
  if (sec === 'ocular') return row.oc_fluo_od === 'Positive' || row.oc_fluo_os === 'Positive';
  if (sec === 'blood') return row.sat === 'Positive';
  return false;
}
/** สรุปผลสั้น ๆ สำหรับตาราง */
function summarize(g, sec, row, c) {
  if (!hasData(g, sec, row)) return '';
  const r = row, ref = c ? refFor(c) : null;
  const num = (k, lab, unit, rk) => {
    if (!filled(r[k])) return '';
    let fl = '';
    if (ref && rk && ref[rk]) fl = Number(r[k]) < ref[rk][0] ? ' ↓' : Number(r[k]) > ref[rk][1] ? ' ↑' : '';
    return `${lab} ${r[k]}${unit}${fl}`;
  };
  const first = s => String(s || '').split('\n')[0];
  switch (sec) {
    case 'blood': return [num('hct', 'Hct', '%', 'hct'), num('tp', 'TP', '', 'tp'), num('wbc', 'WBC', '', 'wbc'), num('platelet', 'PLT', '', 'plt'),
      filled(r.sat) ? 'SAT ' + r.sat : '', first(r.cbcInterp || r.blood_interp)].filter(Boolean).join(' · ');
    case 'chem': return [num('chem_bun', 'BUN', '', 'bun'), num('chem_crea', 'Crea', '', 'crea'), num('chem_alt', 'ALT', '', 'alt'), num('chem_ast', 'AST', '', 'ast'),
      num('chem_alp', 'ALP', '', 'alp'), num('chem_ggt', 'GGT', '', 'ggt'), num('chem_alb', 'Alb', '', 'alb'), num('chem_glu', 'Glu', '', 'glu'),
      first(r.chemInterp || r.chem_interp)].filter(Boolean).join(' · ');
    case 'pcv': return [num('pcv', 'PCV', '%', 'hct'), filled(r.serum_color) ? 'Plasma ' + r.serum_color : ''].filter(Boolean).join(' · ');
    case 'bp': return [r.bp_result || '(ยังไม่ระบุผล)', filled(r.bp_method) ? `<span class="muted">· ${esc(r.bp_method)}</span>` : ''].join(' ');
    case 'feces': return [r.fec_result || '(ยังไม่ระบุผล)', filled(r.fec_epg) ? 'EPG ' + r.fec_epg : '', filled(r.fec_method) ? `<span class="muted">· ${esc(r.fec_method)}</span>` : ''].filter(Boolean).join(' · ');
    case 'cyto': return [r.cyto_location, first(r.cyto_results)].filter(Boolean).join(': ');
    case 'urine': return [num('ur_usg', 'USG', '', 'usg'), filled(r.ur_crystal) ? 'Crystal ' + r.ur_crystal : '', first(r.ur_interp)].filter(Boolean).join(' · ');
    case 'kit': return secFields(g, 'kit').filter(f => f.k !== 'kit_setting' && f.type !== 'photos' && filled(r[f.k]) && r[f.k] !== 'ไม่ได้ตรวจ')
      .map(f => `${f.label.replace(/^SNAP /, '')}: ${r[f.k] === 'Positive' ? '<b class="pos">+</b>' : r[f.k] === 'Negative' ? '−' : r[f.k]}`).join(' · ');
    case 'derm': return first(r.derm_results) || r.derm_lesion;
    case 'ocular': return [filled(r.oc_fluo_od) || filled(r.oc_fluo_os) ? `Fluo OD ${r.oc_fluo_od || '-'} / OS ${r.oc_fluo_os || '-'}` : '',
      filled(r.oc_stt_od) || filled(r.oc_stt_os) ? `STT ${r.oc_stt_od || '-'}/${r.oc_stt_os || '-'} มม.` : '', first(r.oc_interp)].filter(Boolean).join(' · ');
    case 'vag': return [r.vag_interp, filled(r.vag_superficial) ? `Superficial ${r.vag_superficial}%` : ''].filter(Boolean).join(' · ');
  }
  return '';
}
/** ข้อความสรุปที่ผ่าน esc แล้ว (บาง section ใส่ HTML เอง) */
function summaryHTML(g, sec, row, c) {
  const s = summarize(g, sec, row, c);
  if (!s) return '';
  const html = (sec === 'kit' || sec === 'bp' || sec === 'feces') ? s.replace(/^([^<]*)/, m => esc(m)) : esc(s);
  return (isPositive(g, sec, row) ? '<span class="badge pospill">พบ</span> ' : '') + html;
}

/** บันทึกผลของ 1 แท็บ — สร้างแถวผลให้อัตโนมัติถ้ายังไม่มี (id = <caseId>-r1 กันสองเครื่องสร้างซ้ำ) */
async function saveSection(c, sec, vals) {
  const sheet = RES_SHEET(c.animalGroup);
  const row = resultRow(c);
  // โค: Hct (แท็บ Blood) = PCV (แท็บ PCV/Plasma) — กรอกที่ไหนก็ขึ้นทั้งสองที่ (เซิร์ฟเวอร์ทำซ้ำอีกชั้น)
  if (c.animalGroup === 'LA') {
    const was = k => String((row || {})[k] ?? '');
    if ('hct' in vals && String(vals.hct ?? '') !== was('hct')) vals.pcv = vals.hct;
    else if ('pcv' in vals && String(vals.pcv ?? '') !== was('pcv')) vals.hct = vals.pcv;
  }
  if (!row) return saveRecord(sheet, c.id.slice(0, 60) + '-r1', Object.assign({ caseId: c.id, examNo: 1 }, vals), { isNew: true });
  const ch = diffOf(row, vals);
  if (!Object.keys(ch).length) return { nochange: true };
  return saveRecord(sheet, row.id, ch);
}

/** ฟอร์มผลแลป 1 แท็บ */
function sectionFormHTML(c, sec, row, ro) {
  const g = c.animalGroup === 'LA' ? 'LA' : 'SA';
  const fs = secFields(g, sec);
  const ref = refFor(c);
  const t = TESTS.find(x => x.k === sec);
  const hasDiff = fs.some(f => f.diff);
  return `<form id="secForm" novalidate data-case="${esc(c.id)}">
    <div class="card"><h2>${esc(t.label)} <span class="fl ${esc((row || {})[t.set] || '')}">${esc((row || {})[t.set] || '')}</span></h2>
      ${ref && fs.some(f => f.ref) ? `<p class="small muted" style="margin-top:0">แสดงค่าอ้างอิงโดยประมาณของ${esc(c.species || 'โค')} — ค่านอกช่วงขึ้น ↑ ↓ สีเหลือง (ยังบันทึกได้)</p>` : ''}
      <fieldset ${ro ? 'disabled' : ''}>${formHTML(fs, row || {}, ro)}</fieldset>
      ${hasDiff ? '<div class="small" id="diffSum" style="margin-top:8px"></div>' : ''}
      ${row && hasData(g, sec, row) ? `<div class="small muted" style="margin-top:10px">ลงผลล่าสุดโดย <b>${esc(row.updatedBy || row.createdBy || '-')}</b> ${fmtTime(row.updatedAt)}</div>` : ''}
    </div>
    ${ro ? '<div class="alert info small">ดูได้อย่างเดียว — ลงผลได้เฉพาะหน่วยเจ้าของตัวอย่าง หรือ Lab-path</div>'
      : `<div class="formbar"><button class="btn pri big" type="submit" style="flex:1">💾 บันทึกผล ${esc(t.short)}</button>${row && hasData(g, sec, row) ? '<button class="btn danger" type="button" id="secClear">🗑 ลบผลการตรวจนี้</button>' : ''}</div>`}
  </form>`;
}
function bindSectionForm(root, c, sec, onSaved, setDirty) {
  const g = c.animalGroup === 'LA' ? 'LA' : 'SA';
  const fs = secFields(g, sec);
  const form = $('#secForm', root); if (!form) return;
  const ref = refFor(c);
  const dkey = `draft_res_${c.id}_${sec}`;
  const draft = store.get(dkey, null);
  if (draft && !form.querySelector('fieldset[disabled]')) { // กู้ร่างที่ยังไม่บันทึก
    Object.keys(draft).forEach(k => {
      const box = $(`[data-chips="${k}"]`, form);
      if (box) { const sel = splitMulti(draft[k]).map(String); $$('input', box).forEach(i => i.checked = sel.includes(i.value)); }
      else { const el = $(`[name="${k}"]`, form); if (el) el.value = draft[k]; }
    });
    form.insertAdjacentHTML('afterbegin', '<div class="alert info small">กู้คืนค่าที่พิมพ์ค้างไว้ (ยังไม่ได้บันทึก)</div>');
  }
  // ค่าอ้างอิง + ↑↓ + ผลรวม differential แบบสด
  const live = () => {
    fs.filter(f => f.ref || HARD[f.k]).forEach(f => {
      const box = $(`.fld[data-k="${f.k}"]`, form); if (!box) return;
      let hint = $('.refhint', box); if (!hint) { hint = document.createElement('div'); hint.className = 'refhint small'; box.appendChild(hint); }
      const v = $(`[name="${f.k}"]`, form).value.trim(), n = Number(v), rr = ref && f.ref ? ref[f.ref] : null;
      box.classList.remove('warn');
      let txt = rr ? `อ้างอิง ${rr[0]}–${rr[1]}` : '';
      if (v !== '' && isFinite(n)) {
        if (HARD[f.k] && (n < HARD[f.k][0] || n > HARD[f.k][1])) { txt = `เป็นไปไม่ได้ (ต้อง ${HARD[f.k][0]}–${HARD[f.k][1]})`; box.classList.add('warn'); }
        else if (rr && n < rr[0]) { txt = `↓ ต่ำกว่าอ้างอิง (${rr[0]}–${rr[1]})`; box.classList.add('warn'); }
        else if (rr && n > rr[1]) { txt = `↑ สูงกว่าอ้างอิง (${rr[0]}–${rr[1]})`; box.classList.add('warn'); }
      }
      hint.textContent = txt;
    });
    const ds = $('#diffSum', form);
    if (ds) {
      const vals = DIFF.map(f => $(`[name="${f.k}"]`, form).value.trim()).filter(v => v !== '');
      const sum = vals.reduce((a, b) => a + (Number(b) || 0), 0);
      ds.innerHTML = vals.length ? `ผลรวม Differential count: <b style="color:${Math.abs(sum - 100) <= 0.5 ? 'var(--ok)' : 'var(--err)'}">${sum}%</b> ${Math.abs(sum - 100) <= 0.5 ? '✓' : '(ต้องเท่ากับ 100%)'}` : '<span class="muted">Differential count: ผลรวมต้องเท่ากับ 100%</span>';
    }
  };
  live();
  form.addEventListener('input', () => { live(); setDirty && setDirty(true); store.set(dkey, readForm(form, fs)); });
  form.addEventListener('change', () => { setDirty && setDirty(true); store.set(dkey, readForm(form, fs)); });
  form.onsubmit = async e => {
    e.preventDefault();
    const vals = readForm(form, fs);
    if (validateForm(form, fs, vals).length) return toast('ตรวจสอบช่องที่เป็นสีแดง', 'err');
    for (const k of Object.keys(HARD)) if (filled(vals[k]) && (vals[k] < HARD[k][0] || vals[k] > HARD[k][1])) return toast(`${fieldLabel(k)} = ${vals[k]} เป็นไปไม่ได้`, 'err');
    const dv = DIFF.map(f => vals[f.k]).filter(filled);
    if (dv.length && Math.abs(dv.reduce((a, b) => a + Number(b), 0) - 100) > 0.5) return toast('Differential count รวมต้องเท่ากับ 100%', 'err');
    const btn = $('button[type=submit]', form); btn.disabled = true;
    const r = await saveSection(c, sec, vals);
    btn.disabled = false;
    if (r.nochange) return toast('ไม่มีการเปลี่ยนแปลง', 'info');
    if (!r.error) { store.del(dkey); setDirty && setDirty(false); }
    saveToast(r, 'บันทึกผลแล้ว');
    onSaved && onSaved();
  };
  const clr = $('#secClear', form);
  if (clr) clr.onclick = async () => {
    const t = TESTS.find(x => x.k === sec);
    if (!await confirmBox(`ลบผล ${t.short}?`, `ผล ${esc(t.label)} ของ ${esc(c.sampleNo || '')} จะถูกล้างทั้งหมด (ข้อมูลอื่นของตัวนี้ไม่หาย · ดูย้อนหลังได้ในแท็บประวัติแก้ไข)`, 'ลบผล', 'danger')) return;
    const vals = {}; fs.forEach(f => vals[f.k] = '');
    clr.disabled = true;
    const r = await saveSection(c, sec, vals);
    clr.disabled = false;
    if (r.nochange) return toast('ไม่มีผลให้ลบ', 'info');
    if (!r.error) { store.del(dkey); setDirty && setDirty(false); }
    saveToast(r, 'ลบผลแล้ว');
    onSaved && onSaved();
  };
}

/* =====================================================================
 * 14) หน้า "ผลแลปวันนี้" — แยกแท็บตามการตรวจ: วันนี้ตรวจตัวไหน ผลเป็นอย่างไร
 * ===================================================================== */
function VIEWS_lab(el, tab, qs) {
  const p = Object.fromEntries(new URLSearchParams(qs || ''));
  tab = TESTS.some(t => t.k === tab) ? tab : (store.get('labTab', 'blood'));
  store.set('labTab', tab);
  const draw = () => {
    const day = Number(p.day) || S.viewDay || todayDay() || 1;
    const unitF = p.unit ?? store.get('labUnit', '');
    const showF = p.show || 'all';
    const cases = rows('Cases').filter(c => Number(c.campDay) === day && unitMatch(c, unitF));
    const info = c => { const g = c.animalGroup === 'LA' ? 'LA' : 'SA'; const row = resultRow(c); return { g, row }; };
    const listFor = k => cases.filter(c => {
      const { g, row } = info(c);
      if (g === 'LA' && !TESTS.find(t => t.k === k).la) return false;
      return requestedTests(c).includes(k) || hasData(g, k, row);
    });
    const counts = Object.fromEntries(TESTS.map(t => {
      const l = listFor(t.k); return [t.k, { n: l.length, done: l.filter(c => { const { g, row } = info(c); return hasData(g, t.k, row); }).length }];
    }));
    let list = listFor(tab).map(c => ({ c, ...info(c) })).map(o => ({ ...o, done: hasData(o.g, tab, o.row), pos: isPositive(o.g, tab, o.row) }));
    if (showF === 'todo') list = list.filter(o => !o.done);
    if (showF === 'pos') list = list.filter(o => o.pos);
    list.sort((a, b) => (a.done - b.done) || String(a.c.sampleNo || '~').localeCompare(String(b.c.sampleNo || '~'), 'th', { numeric: true }));
    const t = TESTS.find(x => x.k === tab);
    const q = (o) => '#/lab/' + tab + '/' + new URLSearchParams(Object.assign({ day, unit: unitF, show: showF }, o)).toString();
    el.innerHTML = `
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <h1 style="margin:0">ผลแลป Day ${day} <span class="small muted">${esc(S.campDates[day] || '')}${todayDay() === day ? ' · วันนี้' : ''}</span></h1>
        <a class="btn pri" href="#/new">＋ รับตัวอย่าง</a>
      </div>
      <div class="card" style="padding:8px 12px">
        <div class="row">
          <div class="chips">${campDays().map(d => `<a class="chip" href="${q({ day: d })}"><input type="checkbox" ${d === day ? 'checked' : ''} tabindex="-1"><span>Day ${d}</span></a>`).join('')}</div>
          <select id="labUnit" style="width:auto;min-width:180px" aria-label="หน่วย"><option value="">ทุกหน่วย</option>${unitFilterOpts(unitF)}</select>
          <div class="chips">${[['all', 'ทั้งหมด'], ['todo', 'ยังไม่ลงผล'], ['pos', 'พบ/Positive']].map(([k, l]) => `<a class="chip" href="${q({ show: k })}"><input type="checkbox" ${k === showF ? 'checked' : ''} tabindex="-1"><span>${l}</span></a>`).join('')}</div>
        </div>
      </div>
      <nav class="tabs" aria-label="ชนิดการตรวจ">${TESTS.map(x => `<a href="${'#/lab/' + x.k + '/' + new URLSearchParams({ day, unit: unitF, show: showF })}" class="${x.k === tab ? 'act' : ''}">${esc(x.short)} <span class="cnt ${counts[x.k].n && counts[x.k].done === counts[x.k].n ? 'all' : ''}">${counts[x.k].done}/${counts[x.k].n}</span></a>`).join('')}</nav>

const PATHO = [

  ['bp_theileria_orientalis','Theileria orientalis','T. orientalis'], ['bp_theileria_luwenshuni','Theileria luwenshuni','T. luwenshuni'],
  ['bp_plasmodium_bubalis','Plasmodium bubalis','P. bubalis'], ['bp_plasmodium_caprae','Plasmodium caprae','P. caprae'],
  ['bp_trypanosoma_evansi','Trypanosoma evansi','T. evansi'], ['bp_anaplasma_marginale','Anaplasma marginale','A. marginale'],
  ['bp_hemo_mycoplasma','Hemotropic Mycoplasma','Hemo. Myco'], ['bp_setaria','Setaria (non-virulent)','Setaria']

function pcvStats(list) {
  const v = list.map(pcvOf).filter(x => x !== null).sort((a, b) => a - b), n = v.length;
  if (!n) return null;
  const mean = v.reduce((a, b) => a + b, 0) / n;
  const sd = n > 1 ? Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1)) : 0;
  const med = n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2;
  const an = v.filter(x => x < ANEMIA_PCV).length;
  return { n, mean, sd, med, min: v[0], max: v[n - 1], an, ci: wilson(an, n), v };

/** กราฟวงกลม SVG: items = [{label, v, color}] */
function pieSVG(items, size) {
  const tot = items.reduce((a, b) => a + b.v, 0), r = size / 2, c = r;
  if (!tot) return '';

    const a1 = a0 + fr * 2 * Math.PI, p = a => (c + r * Math.cos(a)).toFixed(2) + ' ' + (c + r * Math.sin(a)).toFixed(2);
    const d = `M${c} ${c} L${p(a0)} A${r} ${r} 0 ${fr > 0.5 ? 1 : 0} 1 ${p(a1)} Z`;
