  const opt = (k, label, vals, show = v => v) => `<div class="fld"><label>${label}</label><select data-f="${k}"><option value="">ทั้งหมด</option>${vals.map(v => `<option value="${esc(v)}" ${String(f[k]) === String(v) ? 'selected' : ''}>${esc(show(v))}</option>`).join('')}</select></div>`;
  const uniq = k => [...new Set(all.map(r => r[k]).filter(filled))].sort();
  return `<div class="card"><div class="grid">${opt('day', 'วัน', campDays().map(String), v => 'Day ' + v)}${opt('group', 'กลุ่ม', groupList(), v => 'กลุ่ม ' + v)}${opt('farm', 'ฟาร์ม', uniq('farmName'))}
    ${opt('species', 'ชนิดสัตว์', uniq('species'))}${opt('unit', 'หน่วย', uniq('unit'))}${opt('method', 'วิธีตรวจ', uniq('method'))}</div></div>`;
}
function bindCattleFilters(el, redraw) {
  $$('[data-f]', el).forEach(s => s.onchange = () => { const f = cattleFilters(); f[s.dataset.f] = s.value; store.set('bpFilter', f); redraw(); });
}

function cattlePrev(el, top, mode = 'prev') {
  const draw = () => {
    const f = cattleFilters(), all = cattleFiltered(f), data = all.filter(bpDone), n = data.length;
    const by = store.get('bpBy', 'farmName');
    const stat = list => PATHO.map(p => { const x = list.filter(r => isPos(r[p.k])).length; return { p, x, n: list.length, ci: wilson(x, list.length) }; });
    const st = stat(data);
    const anyX = data.filter(r => PATHO.some(p => isPos(r[p.k]))).length, anyCI = wilson(anyX, n);
    const P = pcvStats(all), sr = all.filter(r => filled(r.serumColor));
    const colorKeys = [...new Set((S.lists.serum_color || []).concat(sr.map(r => r.serumColor)))];
    const colorOf = k => SERUM_COLOR_HEX[colorKeys.indexOf(k) % SERUM_COLOR_HEX.length];
    const sItems = colorKeys.map(k => ({ label: k, v: sr.filter(r => r.serumColor === k).length, color: colorOf(k) })).filter(i => i.v);
    const bins = [['< 15% (โลหิตจางรุนแรง)', 0, 15], ['15–19%', 15, 20], ['20–23%', 20, 24], ['24–46% (ปกติ)', 24, 46.0001], ['> 46%', 46.0001, 1e9]];
    const both = all.filter(r => bpDone(r) && pcvOf(r) !== null), bpPos = both.filter(r => PATHO.some(p => isPos(r[p.k]))), bpNeg = both.filter(r => !PATHO.some(p => isPos(r[p.k])));
    const groups = [...new Set(all.map(r => String(r[by] ?? '')))].sort((a, b) => a.localeCompare(b, 'th', { numeric: true }));
    const byLabel = { farmName: 'ฟาร์ม', campDay: 'วัน', species: 'ชนิดสัตว์', sex: 'เพศ', unit: 'หน่วย' };
    const gName = gv => esc(by === 'campDay' ? 'Day ' + gv : gv || '(ไม่ระบุ)');
    const bySel = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">แยกตาม</h2>
        <select id="bpBy" style="width:auto">${Object.entries(byLabel).map(([k, l]) => `<option value="${k}" ${k === by ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
    const src = L => `<p class="small muted">🔗 รวมข้อมูลอัตโนมัติ: กรอกเป็นชุด ${L.filter(r => !r._case && !r.caseId).length} ตัว + เคสโครายตัว ${L.filter(r => r._case || r.caseId).length} ตัว · อัปเดตเองเมื่อมีคนลงผลเพิ่ม</p>`;
    let body = '';
    if (mode === 'pcv') {
      body = !P ? '<div class="card empty">ยังไม่มีค่า PCV ตามตัวกรอง — ลงผลในแท็บ PCV/Plasma ของเคสโค หรือกรอกเป็นชุด</div>' : `
      <div class="card"><h2>PCV / Hematocrit — ตรวจ ${P.n} ตัว</h2>
        <p>เฉลี่ย <b>${P.mean.toFixed(1)}%</b> (SD ${P.sd.toFixed(1)}) · มัธยฐาน ${P.med.toFixed(1)}% · ต่ำสุด–สูงสุด ${P.min}–${P.max}%<br>
          โลหิตจาง (PCV &lt; ${ANEMIA_PCV}%) <b>${P.an} ตัว (${pct(P.an / P.n)}%, 95% CI ${pct(P.ci[0])}–${pct(P.ci[1])}%)</b></p>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>ช่วง PCV</th><th class="n">จำนวน</th><th class="n">%</th><th style="width:45%">กราฟ</th></tr></thead><tbody>
          ${bins.map(([l, lo, hi]) => { const x = P.v.filter(v => v >= lo && v < hi).length; return `<tr><td>${esc(l)}</td><td class="n mono">${x}</td><td class="n mono">${pct(x / P.n)}</td><td><div class="cibar"><i style="width:${(x / P.n * 100).toFixed(1)}%;${lo < ANEMIA_PCV ? 'background:#dc2626' : ''}"></i></div></td></tr>`; }).join('')}
        </tbody></table></div>
        ${both.length ? `<h3 style="margin:14px 0 6px">PCV เทียบกับผล Blood parasite</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>กลุ่ม</th><th class="n">n</th><th class="n">PCV เฉลี่ย ± SD (%)</th><th class="n">โลหิตจาง</th></tr></thead><tbody>
          ${[['พบเชื้ออย่างน้อย 1 ชนิด', bpPos], ['ไม่พบเชื้อ', bpNeg]].map(([l, L]) => { const q = pcvStats(L); return `<tr><td>${l}</td><td class="n mono">${L.length}</td><td class="n mono">${q ? q.mean.toFixed(1) + ' ± ' + q.sd.toFixed(1) : '-'}</td><td class="n mono">${q ? `${q.an} (${pct(q.an / q.n)}%)` : '-'}</td></tr>`; }).join('')}
        </tbody></table></div>` : ''}
        <p class="small muted">ช่วงอ้างอิง PCV โค 24–46% · โลหิตจาง = PCV &lt; ${ANEMIA_PCV}%</p>${src(all.filter(r => pcvOf(r) !== null))}</div>
      <div class="card">${bySel}
        <div class="tblwrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>${byLabel[by]}</th><th class="n">n</th><th class="n">เฉลี่ย ± SD (%)</th><th class="n">มัธยฐาน</th><th class="n">ต่ำสุด–สูงสุด</th><th class="n">โลหิตจาง</th></tr></thead><tbody>
        ${groups.map(gv => { const q = pcvStats(all.filter(r => String(r[by] ?? '') === gv)); return !q ? '' : `<tr><td>${gName(gv)}</td><td class="n mono">${q.n}</td><td class="n mono">${q.mean.toFixed(1)} ± ${q.sd.toFixed(1)}</td><td class="n mono">${q.med.toFixed(1)}</td><td class="n mono">${q.min}–${q.max}</td><td class="n mono ${q.an ? 'hl' : ''}">${q.an} (${pct(q.an / q.n)}%)</td></tr>`; }).join('')}
        </tbody></table></div></div>`;
    } else if (mode === 'plasma') {
      body = !sr.length ? '<div class="card empty">ยังไม่มีข้อมูลสี plasma ตามตัวกรอง — ลงผลในแท็บ PCV/Plasma ของเคสโค หรือกรอกเป็นชุด</div>' : `
      <div class="card"><h2>สี plasma — ดูแล้ว ${sr.length} ตัว</h2>
        <div class="pies">${pieSVG(sItems, 170)}<ul class="pielg">${sItems.map(i => `<li><span class="dot" style="background:${i.color};border:1px solid #cbd5e1"></span><span>${esc(i.label)}</span><span class="v mono">${i.v}/${sr.length} · <b>${pct(i.v / sr.length)}%</b></span></li>`).join('')}</ul></div>
        ${src(sr)}</div>
      <div class="card">${bySel}
        <div class="tblwrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>${byLabel[by]}</th><th class="n">n</th>${sItems.map(i => `<th class="n">${esc(i.label)}</th>`).join('')}</tr></thead><tbody>
        ${groups.map(gv => { const L = sr.filter(r => String(r[by] ?? '') === gv); return !L.length ? '' : `<tr><td>${gName(gv)}</td><td class="n mono">${L.length}</td>${sItems.map(i => { const x = L.filter(r => r.serumColor === i.label).length; return `<td class="n mono">${x ? `${x} <span class="muted">(${pct(x / L.length)}%)</span>` : '0'}</td>`; }).join('')}</tr>`; }).join('')}
        </tbody></table></div></div>`;
    } else {
      body = !n ? '<div class="card empty">ยังไม่มีผล Blood parasite ตามตัวกรอง</div>' : `
      <div class="card"><h2>ความชุกรวม — ตรวจ ${n} ตัว · พบอย่างน้อย 1 ชนิด ${anyX} ตัว (${pct(anyX / n)}%, 95% CI ${pct(anyCI[0])}–${pct(anyCI[1])}%)</h2>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>เชื้อ</th><th class="n">Positive</th><th class="n">ตรวจ (n)</th><th class="n">ความชุก (%)</th><th class="n">95% CI (Wilson)</th><th style="width:34%">กราฟ</th></tr></thead><tbody>
        ${st.map(({ p, x, n, ci }) => `<tr><td><i>${esc(p.name)}</i></td><td class="n mono">${x}</td><td class="n mono">${n}</td><td class="n mono"><b>${pct(x / n)}</b></td><td class="n mono">${pct(ci[0])}–${pct(ci[1])}</td>
          <td><div class="cibar" title="${pct(x / n)}% (${pct(ci[0])}–${pct(ci[1])})"><i style="width:${(x / n * 100).toFixed(1)}%"></i><s style="left:${(ci[0] * 100).toFixed(1)}%;width:${((ci[1] - ci[0]) * 100).toFixed(1)}%"></s></div></td></tr>`).join('')}
        <tr><td><b>พบอย่างน้อย 1 ชนิด</b></td><td class="n mono"><b>${anyX}</b></td><td class="n mono">${n}</td><td class="n mono"><b>${pct(anyX / n)}</b></td><td class="n mono">${pct(anyCI[0])}–${pct(anyCI[1])}</td>
          <td><div class="cibar"><i style="width:${(anyX / n * 100).toFixed(1)}%"></i><s style="left:${(anyCI[0] * 100).toFixed(1)}%;width:${((anyCI[1] - anyCI[0]) * 100).toFixed(1)}%"></s></div></td></tr>
        </tbody></table></div>
        <p class="small muted">แท่งสี = ความชุก · เส้นขอบ = ช่วงความเชื่อมั่น 95% · ความชุก = จำนวน Positive ÷ จำนวนที่ตรวจ × 100</p>${src(data)}</div>
      <div class="card">${bySel}
        <div class="tblwrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>${byLabel[by]}</th><th class="n">n</th>${PATHO.map(p => `<th class="n" title="${esc(p.name)}"><i>${esc(p.sh)}</i></th>`).join('')}<th class="n">≥1 ชนิด</th></tr></thead><tbody>
        ${groups.map(gv => { const L = data.filter(r => String(r[by] ?? '') === gv); if (!L.length) return ''; const ax = L.filter(r => PATHO.some(p => isPos(r[p.k]))).length;
          return `<tr><td>${gName(gv)}</td><td class="n mono">${L.length}</td>${stat(L).map(({ x, n }) => `<td class="n mono ${x ? 'hl' : ''}">${x ? `${x} <span class="muted">(${pct(x / n)}%)</span>` : '0'}</td>`).join('')}<td class="n mono"><b>${ax}</b> (${pct(ax / L.length)}%)</td></tr>`; }).join('')}
        </tbody></table></div></div>`;
    }
    el.innerHTML = top + cattleFilterHTML(f) + (all.length ? body + `
      <div class="card"><h2>ส่งออกข้อมูล</h2><div class="row">
        <button class="btn" id="csvRaw">⬇ CSV รายตัว (1 แถว = 1 ตัว, SPSS)</button>
        <button class="btn" id="csvAnon">⬇ CSV รายตัว (ตัดชื่อเจ้าของ — สำหรับเผยแพร่)</button>
        <button class="btn" id="csvSum">⬇ CSV สรุปผล (BP · PCV · plasma)</button></div>
        <p class="small muted">ส่งออกตามตัวกรองด้านบน · 1 ไฟล์มีครบทั้ง Blood parasite, PCV และสี plasma · ไฟล์เปิดใน Excel ภาษาไทยได้ · ค่า Positive = 1, Negative = 0 (ว่าง = ยังไม่ลงผล) · anemia = PCV &lt; ${ANEMIA_PCV}%</p></div>`
      : `<div class="card empty">ยังไม่มีข้อมูลตามตัวกรอง — ลงผล Blood parasite / PCV / สี plasma ในเคสโค (ระบบดึงมาให้อัตโนมัติ) หรือไปที่แท็บ <a href="#/cattle/entry">กรอกเป็นชุด</a></div>`);
    bindCattleFilters(el, draw);
    const byEl = $('#bpBy', el); if (byEl) byEl.onchange = () => { store.set('bpBy', byEl.value); draw(); };
    const raw = anon => {
      const cols = ['sampleNo', 'campDay', 'date', 'unit', 'farmName', ...(anon ? [] : ['ownerName']), 'moo', 'animalId', 'species', 'age', 'sex', 'breed', 'method'];
      downloadCSV(`pbl_cattle${anon ? '_deid' : ''}_${todayStr()}.csv`, [...cols, ...PATHO.map(p => p.name), 'any_positive', 'pcv_pct', 'anemia_pcv_lt24', 'plasma_color', 'note', 'recorder'],
        all.map(r => [...cols.map(c => r[c]), ...PATHO.map(p => bpDone(r) ? (isPos(r[p.k]) ? 1 : 0) : ''), bpDone(r) ? (PATHO.some(p => isPos(r[p.k])) ? 1 : 0) : '',
          pcvOf(r) ?? '', pcvOf(r) === null ? '' : (isAnemic(r) ? 1 : 0), r.serumColor || '', r.note, r.recorder]));
    };
    if ($('#csvRaw', el) && all.length) {
      $('#csvRaw', el).onclick = () => raw(false);
      $('#csvAnon', el).onclick = () => raw(true);
      $('#csvSum', el).onclick = () => downloadCSV(`pbl_cattle_summary_${todayStr()}.csv`, ['item', 'positive', 'n', 'pct', 'ci95_low', 'ci95_high'],
        [...st.map(({ p, x, n, ci }) => [p.name, x, n, n ? pct(x / n) : '', pct(ci[0]), pct(ci[1])]), ['Any (>=1)', anyX, n, n ? pct(anyX / n) : '', pct(anyCI[0]), pct(anyCI[1])],
          ...(P ? [['Anemia (PCV<' + ANEMIA_PCV + '%)', P.an, P.n, pct(P.an / P.n), pct(P.ci[0]), pct(P.ci[1])], ['PCV mean (SD) %', P.mean.toFixed(1), P.n, 'SD ' + P.sd.toFixed(1), P.min, P.max]] : []),
          ...sItems.map(i => ['Plasma: ' + i.label, i.v, sr.length, pct(i.v / sr.length), '', ''])]);
    }
  };
  draw();
  currentView.refresh = draw;
}

/** ติดตามรายตัว: วัวแต่ละตัวมีเชื้ออะไร · crit เท่าไหร่ · สี plasma อะไร */
function cattleInd(el, top) {
  let q = store.get('bpIndQ', '');
  const norm = v => String(v || '').toLowerCase().replace(/[-\s]/g, '');
  const pend = '<span class="muted">ยังไม่ลงผล</span>';
  const card = r => {
    const ps = PATHO.filter(p => isPos(r[p.k])), v = pcvOf(r);
    const ck = S.lists.serum_color || [], ci = ck.indexOf(r.serumColor);
    const hex = SERUM_COLOR_HEX[(ci < 0 ? ck.length : ci) % SERUM_COLOR_HEX.length];
    return `<div class="card" data-id="${esc(r.id)}" style="cursor:pointer;margin:0" title="แตะเพื่อดู/แก้ผล">
      <div class="row" style="justify-content:space-between;gap:6px"><b class="mono">${esc(r.sampleNo || 'รอเลข')}</b><span class="small muted">Day ${esc(r.campDay)} · ${esc(r.species || '')}</span></div>
      <div class="small muted">${esc(r.animalId || '-')} · ${esc(r.farmName || '')}${filled(r.age) ? ' · ' + esc(r.age) + ' ปี' : ''}${r.sex ? ' · ' + esc(r.sex) : ''}</div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin-top:10px;align-items:center">
        <span class="small">🩸 Blood parasite</span><span>${!bpDone(r) ? pend : ps.length ? ps.map(p => `<span class="badge pospill"><i>${esc(p.name)}</i></span>`).join(' ') : '<span class="badge" style="background:#e3f3e9;color:#1d5c38">ไม่พบเชื้อ</span>'}</span>
        <span class="small">📈 PCV / crit</span><span>${v === null ? pend : `<b class="mono">${v}%</b> ${isAnemic(r) ? '<span class="badge pospill">โลหิตจาง ↓</span>' : '<span class="small muted">ปกติ (24–46%)</span>'}`}</span>
        <span class="small">🧪 สี plasma</span><span>${!filled(r.serumColor) ? pend : `<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${hex};border:1px solid #94a3b8;vertical-align:middle"></span> ${esc(r.serumColor)}`}</span>
      </div></div>`;
  };
  const draw = () => {
    const f = cattleFilters();
    el.innerHTML = top + cattleFilterHTML(f) + `<div class="card"><div class="fld"><label for="indQ">ค้นหาวัว: เลขตัวอย่าง / หมายเลขสัตว์ (ear tag) / ฟาร์ม / เจ้าของ</label>
        <input id="indQ" type="search" value="${esc(q)}" placeholder="เช่น 1-LA-04-001 หรือ TH-1001" autocomplete="off"></div><p class="small muted" id="indN" style="margin:6px 0 0"></p></div>
      <div id="indList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px"></div>`;
    const list = () => {
      const all = cattleFiltered(cattleFilters()).sort((a, b) => String(a.sampleNo || '~').localeCompare(String(b.sampleNo || '~'), 'th', { numeric: true }));
      const k = norm(q), L = k ? all.filter(r => [r.sampleNo, r.animalId, r.farmName, r.ownerName].some(v => norm(v).includes(k))) : all;
      const done3 = L.filter(r => bpDone(r) && pcvOf(r) !== null && filled(r.serumColor)).length;
      $('#indN', el).textContent = `${L.length} ตัว · ลงผลครบ 3 อย่างแล้ว ${done3} ตัว${L.length > 300 ? ' (แสดง 300 ตัวแรก)' : ''}`;
      $('#indList', el).innerHTML = L.slice(0, 300).map(card).join('') || '<div class="card empty">ไม่พบวัวตามเงื่อนไข</div>';
      $$('[data-id]', $('#indList', el)).forEach(c => c.onclick = () => {
        const id = c.dataset.id, r = id.startsWith('case:') ? null : getRec('BloodParasite_Cattle', id);
        const cid = id.startsWith('case:') ? id.slice(5) : (r && r.caseId);
        if (cid) go('#/case/' + encodeURIComponent(cid) + '/pcv'); else editCattle(id, draw);
      });
    };
    let t; $('#indQ', el).oninput = e => { q = e.target.value; store.set('bpIndQ', q); clearTimeout(t); t = setTimeout(list, 150); };
    bindCattleFilters(el, draw);
    list();
  };
  draw();
  currentView.refresh = draw;
}

function cattleList(el, top) {
  const draw = () => {
    const f = cattleFilters();
    const data = cattleFiltered(f).sort((a, b) => String(a.sampleNo || '~').localeCompare(String(b.sampleNo || '~'), 'th', { numeric: true }));
    el.innerHTML = top + cattleFilterHTML(f) + `<div class="card" style="padding:0">
      ${data.length ? `<div class="tblwrap" style="border:0"><table class="tbl"><thead><tr><th>เลขตัวอย่าง</th><th>ฟาร์ม</th><th>หมายเลขสัตว์</th><th>อายุ/เพศ</th><th>วิธี</th><th>ผล Positive</th><th>PCV / สี plasma</th><th>บันทึกโดย</th></tr></thead><tbody>
        ${data.map(r => { const ps = PATHO.filter(p => isPos(r[p.k])); return `<tr data-id="${esc(r.id)}" style="cursor:pointer">
          <td class="mono"><b>${esc(r.sampleNo || 'รอเลข')}</b>${r._pending ? ' <span class="badge pend">⏳</span>' : ''}${r._case || r.caseId ? '<div class="small muted">🔗 จากเคส</div>' : ''}</td><td>${esc(r.farmName || '')}<div class="small muted">Day ${esc(r.campDay)} · ${esc(r.species || '')}</div></td>
          <td>${esc(r.animalId)}</td><td>${esc(r.age ?? '')} ${filled(r.age) ? 'ปี' : ''} ${esc(r.sex || '')}</td><td class="small">${esc(r.method || '')}</td>
          <td>${!bpDone(r) ? '<span class="muted">ยังไม่ลงผล BP</span>' : ps.length ? ps.map(p => `<span class="badge pospill"><i>${esc(p.sh)}</i></span>`).join(' ') : '<span class="muted">Negative ทั้งหมด</span>'}</td>
          <td class="small">${pcvOf(r) !== null ? `<b class="mono ${isAnemic(r) ? 'pos' : ''}">${pcvOf(r)}%${isAnemic(r) ? ' ↓' : ''}</b>` : '<span class="muted">PCV -</span>'}<div class="muted">${esc(r.serumColor || '')}</div></td>
          <td class="small">${esc(r.updatedBy || r.createdBy || '')}</td></tr>`; }).join('')}
      </tbody></table></div>` : '<div class="empty">ยังไม่มีข้อมูล</div>'}</div>`;
    bindCattleFilters(el, draw);
    $$('tr[data-id]', el).forEach(tr => tr.onclick = () => {
      const r = tr.dataset.id.startsWith('case:') ? null : getRec('BloodParasite_Cattle', tr.dataset.id);
      const cid = tr.dataset.id.startsWith('case:') ? tr.dataset.id.slice(5) : (r && r.caseId);
      // แถวที่มาจากเคส → แก้ที่หน้าเคส (แท็บ Blood parasite) ระบบอัปเดตชีตให้เอง
      if (cid) go('#/case/' + encodeURIComponent(cid) + '/bp'); else editCattle(tr.dataset.id, draw);
    });
  };
  draw();
  currentView.refresh = draw;
}

      ${fieldHTML({ k:'sex', label:'เพศ', type:'select', opts:['F', 'M'] }, r.sex, !can)}${fieldHTML({ k:'breed', label:'สายพันธุ์', type:'text' }, r.breed, !can)}
      ${fieldHTML({ k:'pcv', label:'PCV / Hct (%)', type:'num' }, r.pcv, !can)}${fieldHTML({ k:'serumColor', label:'สี plasma', type:'select', opts: S.lists.serum_color || [] }, r.serumColor, !can)}</div>

/** แท็บข้อมูลสัตว์: แก้ไข + บันทึก (มี draft อัตโนมัติ) */
function drawInfoTab(body, c, ro, setDirty) {
  const dkey = 'draft_case_' + c.id;
  const draft = store.get(dkey, null);
  let st = Object.assign({}, c, draft && draft.base === c.version ? draft.vals : {});
  const render = () => {
    body.innerHTML = `
      ${draft && draft.base === c.version && !ro ? '<div class="alert info small">มีฉบับร่างที่ยังไม่ได้บันทึก (กู้คืนให้แล้ว) <button class="btn" id="dropDraft" type="button">ทิ้งฉบับร่าง</button></div>' : ''}
      ${draft && draft.base !== c.version && !ro ? '<div class="alert warn small">ฉบับร่างเดิมถูกยกเลิก เพราะมีคนแก้เคสนี้หลังจากนั้น</div>' : ''}
      ${ro ? `<div class="alert info small">ดูได้อย่างเดียว — แก้ไขได้เฉพาะหน่วย ${esc(c.unit)}${c.group ? ', กลุ่ม ' + esc(c.group) : ''} หรือ Lab-path</div>` : ''}
      <form id="infoForm" novalidate>${caseFormHTML(st, ro)}
        <div class="card small muted">สร้างโดย ${esc(c.createdBy || '-')} ${fmtTime(c.createdAt)} · แก้ไขล่าสุดโดย ${esc(c.updatedBy || '-')} ${fmtTime(c.updatedAt)} · เวอร์ชัน ${esc(c.version)}</div>
        ${ro ? '' : `<div class="formbar"><button class="btn pri big" type="submit" style="flex:1">💾 บันทึกข้อมูลสัตว์</button>
          ${c.status !== ST.VERIFIED || isStaff() ? '<button class="btn danger" type="button" id="delCase">ลบเคส</button>' : ''}</div>`}
      </form>`;
    if (draft && draft.base !== c.version) store.del(dkey);
    if (ro) return;
    const form = $('#infoForm', body);
    const fieldsNow = () => caseFields(st.animalGroup || 'SA');
    bindCaseForm(form, () => st, ns => { st = ns; setDirty(true); render(); });
    const onEdit = () => { st = Object.assign(st, readForm(form, fieldsNow())); setDirty(true); store.set(dkey, { base: c.version, vals: diffOf(c, st) }); };
    form.addEventListener('input', onEdit); form.addEventListener('change', onEdit);
    const dd = $('#dropDraft', body); if (dd) dd.onclick = () => { store.del(dkey); setDirty(false); st = Object.assign({}, c); render(); };
    form.onsubmit = async e => {
      e.preventDefault();
      const fields = fieldsNow();
      const vals = cattleTests(Object.assign(readForm(form, fields), { animalGroup: st.animalGroup }));
      if (validateForm(form, fields, vals).length) return toast('กรุณากรอกช่องที่จำเป็นให้ครบ', 'err');
      const qm = quotaBlock(vals, c.id); if (qm) return toast(qm, 'err', 7000);
      if (vals.campDay !== c.campDay) vals.date = S.campDates[vals.campDay] || c.date;
      const ch = diffOf(c, vals);
      if (!Object.keys(ch).length) return toast('ไม่มีการเปลี่ยนแปลง', 'info');
      const r = await saveRecord('Cases', c.id, ch);
      store.del(dkey); setDirty(false);
      saveToast(r);
      refreshView();
    };
    if ($('#delCase', body)) $('#delCase', body).onclick = async () => {
      if (!await confirmBox('ลบเคสนี้?', `เคส ${esc(c.sampleNo || '')} และผลแลปทั้งหมดของเคสจะถูกลบออกจาก Google Sheet จริง (กู้คืนไม่ได้ · มีบันทึกไว้ในชีต AuditLog) · เลข ${esc(c.sampleNo || '')} จะถูกนำไปใช้กับตัวอย่างถัดไป`, 'ลบเคส', 'danger')) return;
      await removeRecord('Cases', c.id);
      store.del(dkey); toast('ลบเคสแล้ว', 'ok'); go('#/search');
    };
  };
  render();
}
/** เทียบค่าที่เปลี่ยน (ใช้ String เทียบ เพราะตัวเลข/ข้อความจากชีตปนกัน) */
function diffOf(orig, vals) {
  const o = {};
  Object.keys(vals).forEach(k => { if (k.startsWith('_')) return; if (String(vals[k] ?? '') !== String(orig[k] ?? '')) o[k] = vals[k]; });
  return o;
}

/* =====================================================================
 * 18) เบิก/คืน Test kit และอุปกรณ์ (ตู้เย็นแลป)
 *     คงเหลือในตู้ = ยอดตั้งต้น − เบิกออก + คืนกลับ  ·  ใช้ไป = เบิก − คืน (เซิร์ฟเวอร์คำนวณ)
 *     เบิกแล้วยังไม่บันทึกยอดคืน → ขึ้นสีแดง
 * ===================================================================== */
function VIEWS_kits(el, kind) {
  kind = 'kit'; // หน้าเบิก/คืนอุปกรณ์ถูกเอาออก เหลือเฉพาะ Test kit (ข้อมูลเดิมในชีต SupplyLog ยังอยู่)
  const sheet = kind === 'kit' ? 'TestKitLog' : 'SupplyLog';
  const items = () => kind === 'kit' ? S.kits : S.supplies;
  const nm = kind === 'kit' ? 'test kit' : 'อุปกรณ์';
  const draw = () => {
    const logs = rows(sheet);
    const n = v => Number(v) || 0;
    const open = logs.filter(r => !filled(r.returned)).sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    const today = todayDay();
    const stock = items().map(it => {
      const L = logs.filter(r => r.item === it.name);
      const out = L.reduce((a, r) => a + n(r.takenOut), 0), back = L.reduce((a, r) => a + n(r.returned), 0);
      const used = L.reduce((a, r) => a + n(r.used), 0), pending = L.filter(r => !filled(r.returned)).reduce((a, r) => a + n(r.takenOut), 0);
      return { ...it, out, back, used, pending, left: it.stock - out + back };
    });
    // รายการที่ไม่อยู่ในตั้งค่า (เช่น พิมพ์ชื่อเอง) ก็ยังแสดง
    [...new Set(logs.map(r => r.item))].filter(x => x && !items().some(i => i.name === x)).forEach(x => {
      const L = logs.filter(r => r.item === x);
      stock.push({ name: x, stock: 0, out: L.reduce((a, r) => a + n(r.takenOut), 0), back: L.reduce((a, r) => a + n(r.returned), 0),
        used: L.reduce((a, r) => a + n(r.used), 0), pending: L.filter(r => !filled(r.returned)).reduce((a, r) => a + n(r.takenOut), 0), left: null });
    });
    el.innerHTML = `
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><h1 style="margin:0">เบิก / คืน ${kind === 'kit' ? 'Test kit' : 'อุปกรณ์เก็บตัวอย่าง'}</h1>
        <button class="btn pri" id="takeBtn">＋ เบิก ${esc(nm)}</button></div>
      ${open.length ? `<div class="card" style="border-color:#f0a8b3"><h2 style="border-left-color:var(--err);color:var(--err)">⚠ เบิกแล้วยังไม่บันทึกยอดคืน (${open.length})</h2>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>วัน</th><th>หน่วย</th><th>รายการ</th><th class="n">เบิก</th><th>ผู้เบิก</th><th></th></tr></thead><tbody>
        ${open.map(r => `<tr class="${today && Number(r.campDay) < today ? 'late' : ''}"><td>Day ${esc(r.campDay)}${Number(r.campDay) < (today || 0) ? ' <span class="badge st-revise">ค้างข้ามวัน</span>' : ''}</td><td>${esc(r.unit)}</td><td><b>${esc(r.item)}</b></td>
          <td class="n mono">${esc(r.takenOut)}</td><td class="small">${esc(r.takenBy || r.createdBy || '')} ${grpTag(r)}<div class="muted">${fmtTime(r.createdAt)}</div></td>
          <td class="n"><button class="btn pri" data-ret="${esc(r.id)}">บันทึกยอดคืน</button></td></tr>`).join('')}
        </tbody></table></div></div>` : `<div class="alert ok small">✓ ทุกรายการที่เบิกบันทึกยอดคืนแล้ว</div>`}
      <div class="card"><h2>คงเหลือในตู้ (เรียลไทม์)</h2>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>รายการ</th><th class="n">ตั้งต้น</th><th class="n">เบิกออก</th><th class="n">คืนกลับ</th><th class="n">ใช้ไป</th><th class="n">ค้างคืน</th><th class="n">คงเหลือในตู้</th></tr></thead><tbody>
        ${stock.map(s => { const low = s.left !== null && s.stock && s.left <= Math.max(1, s.stock * 0.2);
          return `<tr><td><b>${esc(s.name)}</b></td><td class="n mono">${s.stock || '-'}</td><td class="n mono">${s.out}</td><td class="n mono">${s.back}</td><td class="n mono">${s.used}</td>
          <td class="n mono">${s.pending ? `<b style="color:var(--err)">${s.pending}</b>` : '0'}</td>
          <td class="n mono"><b style="${low ? 'color:var(--err)' : ''}">${s.left === null ? '-' : s.left}</b>${low ? ' <span class="badge st-revise">ใกล้หมด</span>' : ''}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">ยังไม่มีรายการในตั้งค่า</td></tr>'}
        </tbody></table></div>
        <p class="small muted">ยอดตั้งต้นแก้ได้ในชีต Settings (หมวด ${kind}) · "ค้างคืน" = เบิกออกไปแล้วยังไม่นับคืน</p></div>
      <div class="card"><h2>ประวัติการเบิก-คืน (${logs.length})</h2>
        ${logs.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>วัน</th><th>หน่วย</th><th>รายการ</th><th class="n">เบิก</th><th class="n">คืน</th><th class="n">ใช้ไป</th><th>ผู้เบิก</th><th>ผู้ตรวจนับ</th><th></th></tr></thead><tbody>
        ${[...logs].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))).map(r => `<tr><td>Day ${esc(r.campDay)}</td><td>${esc(r.unit)}</td><td>${esc(r.item)}</td>
          <td class="n mono">${esc(r.takenOut)}</td><td class="n mono">${filled(r.returned) ? esc(r.returned) : '<span class="badge st-revise">ยังไม่คืน</span>'}</td><td class="n mono">${esc(r.used ?? '')}</td>
          <td class="small">${esc(r.takenBy || '')} ${grpTag(r)}</td><td class="small">${esc(r.countedBy || '')}</td>
          <td class="n" style="white-space:nowrap">${canEditLog(r) ? `<button class="btn" data-edit="${esc(r.id)}">✏️ แก้ไข</button>` : ''}${r._pending ? ' <span class="badge pend">⏳</span>' : ''}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">ยังไม่มีการเบิก</div>'}</div>`;
    $('#takeBtn', el).onclick = () => takeItem(sheet, kind, items(), draw);
    $$('[data-ret]', el).forEach(b => b.onclick = () => returnItem(sheet, b.dataset.ret, draw));
    $$('[data-edit]', el).forEach(b => b.onclick = () => editLog(sheet, kind, items(), b.dataset.edit, draw));
  };
  draw();
  currentView.refresh = draw;
}
/** หาคนในรายชื่อค่ายจากชื่อที่พิมพ์ (ชื่อเต็ม หรือชื่อต้นที่ไม่ซ้ำ) → {name, group} | null */
function memberOf(name) {
  if (!String(name || '').trim()) return null;
  const full = S.members.filter(m => normName(m.name) === normName(name));
  if (full.length === 1) return full[0];
  const first = S.members.filter(m => firstName(m.name) === firstName(name));
  return first.length === 1 ? first[0] : null;
}
const takerHint = name => { const m = memberOf(name); return m ? `กลุ่ม ${m.group} (${m.name})` : (String(name || '').trim() ? 'ไม่พบชื่อในรายชื่อค่าย — ใช้กลุ่มของผู้บันทึก' : ''); };
const grpTag = r => filled(r.group) ? `<span class="badge" style="background:rgba(100,116,139,.15)">กลุ่ม ${esc(r.group)}</span>` : '';
const canEditLog = r => isStaff() || (!!S.session.group && String(r.group || '') === String(S.session.group));

async function takeItem(sheet, kind, items, after) {
  const s = S.session;
  const v = await modal(`<h2>เบิก${kind === 'kit' ? ' Test kit' : 'อุปกรณ์'}</h2>
    <div class="grid">
      ${fieldHTML({ k:'campDay', label:'วันค่าย', type:'day', req:true, w:'full' }, todayDay() || 1)}
      ${fieldHTML({ k:'unit', label:'หน่วยที่เบิก', type:'unit', req:true, w:'l' }, prefUnit())}
      <div class="fld full"><div class="lab">รายการ<span class="req">*</span></div><div class="unitpick">${items.map(i => `<label><input type="radio" name="item" value="${esc(i.name)}"> ${esc(i.name)}</label>`).join('')}</div></div>
      ${fieldHTML({ k:'takenOut', label:'จำนวนที่เบิกออก (อัน)', type:'num', im:'numeric', req:true }, '')}
      ${fieldHTML({ k:'takenBy', label:'ผู้เบิก', type:'text', dl:'members' }, s.user)}
      <div class="fld"><div class="lab">เบิกโดยกลุ่ม</div><div class="small" id="takerGrp" style="padding-top:8px">${esc(takerHint(s.user) || (s.group ? 'กลุ่ม ' + s.group : '-'))}</div></div>
      ${fieldHTML({ k:'note', label:'หมายเหตุ', type:'text', w:'full' }, '')}
    </div>
    <div class="acts"><button class="btn" data-v="null">ยกเลิก</button><button class="btn pri" data-v="ok" data-collect="1">💾 บันทึกการเบิก</button></div>`,
    { onMount(box) { const i = $('[name=takenBy]', box), o = $('#takerGrp', box); i.addEventListener('input', () => o.textContent = takerHint(i.value) || '-'); } });
  if (!v || typeof v !== 'object') return;
  const day = Number(lastModalDay()) || todayDay() || 1;
  const n = Number(v.takenOut);
  if (!v.item) return toast('กรุณาเลือกรายการ', 'warn');
  if (!Number.isInteger(n) || n <= 0) return toast('จำนวนที่เบิกต้องเป็นจำนวนเต็มมากกว่า 0', 'warn');
  setPrefUnit(v.unit);
  const who = memberOf(v.takenBy || s.user); // กลุ่มของการเบิก = กลุ่มของผู้เบิก
  const rec = { unit: v.unit, group: who ? who.group : s.group, campDay: day, date: S.campDates[day] || todayStr(), item: v.item, takenOut: n, returned: '',
    takenBy: who ? who.name : (v.takenBy || s.user), note: v.note };
  if (!rec.unit) return toast('กรุณาเลือกหน่วย', 'warn');
  saveToast(await saveRecord(sheet, uuid(), rec, { isNew: true }), `เบิก ${v.item} ${n} อัน${rec.group ? ' · กลุ่ม ' + rec.group : ''}`);
  after();
}
/** อ่านวันที่เลือกใน modal ล่าสุด (modal collect ไม่อ่าน chip ที่เป็น checkbox) */

async function returnItem(sheet, id, after) {
  const r = getRec(sheet, id); if (!r) return;
  if (!canEditLog(r)) return toast('แก้ได้เฉพาะหน่วย ' + r.unit + ' หรือ Lab-path', 'warn');
  const v = await modal(`<h2>บันทึกยอดคืน — ${esc(r.item)}</h2>

  const names = items.map(i => i.name); if (r.item && !names.includes(r.item)) names.push(r.item);
  const v = await modal(`<h2>แก้ไขการเบิก${kind === 'kit' ? ' Test kit' : 'อุปกรณ์'}</h2>
    <p class="small muted">เบิกโดย ${esc(r.takenBy || r.createdBy || '')}${filled(r.group) ? ' · กลุ่ม ' + esc(r.group) : ''} · บันทึกเมื่อ ${fmtTime(r.createdAt)}</p>
    <div class="grid">
      ${fieldHTML({ k:'campDay', label:'วันค่าย', type:'day', req:true, w:'full' }, r.campDay)}
      ${fieldHTML({ k:'unit', label:'หน่วยที่เบิก', type:'unit', req:true, w:'l' }, r.unit)}
      <div class="fld full"><div class="lab">รายการ<span class="req">*</span></div><div class="unitpick">${names.map(n => `<label><input type="radio" name="item" value="${esc(n)}" ${n === r.item ? 'checked' : ''}> ${esc(n)}</label>`).join('')}</div></div>
      ${fieldHTML({ k:'takenOut', label:'จำนวนที่เบิกออก (อัน)', type:'num', im:'numeric', req:true }, r.takenOut)}
      ${fieldHTML({ k:'returned', label:'จำนวนที่คืน (เว้นว่าง = ยังไม่คืน)', type:'num', im:'numeric' }, r.returned)}
      ${fieldHTML({ k:'takenBy', label:'ผู้เบิก', type:'text', dl:'members' }, r.takenBy || '')}
      ${fieldHTML({ k:'countedBy', label:'ผู้ตรวจนับ', type:'text', dl:'members' }, r.countedBy || '')}
      ${fieldHTML({ k:'note', label:'หมายเหตุ', type:'text', w:'full' }, r.note || '')}
    </div>
    <div class="acts"><button class="btn danger" data-v="del" style="margin-right:auto">🗑 ลบรายการนี้</button><button class="btn" data-v="null">ยกเลิก</button><button class="btn pri" data-v="ok" data-collect="1">💾 บันทึกการแก้ไข</button></div>`);
  if (!v) return;
  if (v === 'del') {
    if (!await confirmBox('ลบรายการเบิกนี้?', `${esc(r.item)} · ${esc(r.takenOut)} อัน · หน่วย ${esc(r.unit)} Day ${esc(r.campDay)}<br>ยอดในตู้จะคำนวณใหม่ · ถ้ากรอกผิดให้กด "＋ เบิก" ใหม่หลังลบ`, 'ลบรายการ', 'danger')) return;
    const res = await removeRecord(sheet, id);
    toast(res.sent ? 'ลบรายการแล้ว' : 'บันทึกไว้ในเครื่อง รอส่ง', res.sent ? 'ok' : 'warn');
    return after();
  }
  if (typeof v !== 'object') return;
  const day = Number(lastModalDay()) || Number(r.campDay) || 1;
  const n = Number(v.takenOut), back = v.returned === '' ? '' : Number(v.returned);
  if (!v.item) return toast('กรุณาเลือกรายการ', 'warn');
  if (!v.unit) return toast('กรุณาเลือกหน่วย', 'warn');
  if (!Number.isInteger(n) || n <= 0) return toast('จำนวนที่เบิกต้องเป็นจำนวนเต็มมากกว่า 0', 'warn');

  after();

/* =====================================================================

 *     จองได้ไม่เกินโควตาต่อช่อง · กลุ่มเดียวกันจองช่องเดิมซ้ำไม่ได้ · ยกเลิกได้เฉพาะคนจองหรือ Lab-path

function VIEWS_booking(el, dayArg) {

        ${slots.map(sl => { const L = at(day, sl, rm), full = L.length >= quota;
          return `<div class="bkslot ${full ? 'full' : ''}"><div class="row" style="justify-content:space-between"><b class="mono">${esc(sl)}</b>

            <div class="bklist">${L.map(b => `<div class="bkitem"><span><b>${esc(b.unit)}</b>${b.group ? ' · กลุ่ม ' + esc(b.group) : ''}<span class="small muted"> — ${esc(b.bookedBy || b.createdBy || '')}</span>${b._pending ? ' ⏳' : ''}${b.note ? `<div class="small muted">${esc(b.note)}</div>` : ''}</span>
              ${isStaff() || b.createdBy === S.session.user ? `<button class="btn" data-cancel="${esc(b.id)}" aria-label="ยกเลิกการจอง">ยกเลิก</button>` : ''}</div>`).join('') || '<div class="small muted">ยังไม่มีการจอง</div>'}</div>

      draw();

  draw();
  currentView.refresh = draw;
}
async function book(day, slot, room, after) {
  const s = S.session;
  if (!s.group && !isStaff()) return toast('กรุณาเลือกกลุ่มก่อน (เมนู เปลี่ยนกลุ่ม)', 'warn');
  const v = await modal(`<h2>จองห้องแลป — Day ${day} · ${esc(slot)}</h2><p class="small muted">${esc(room)} · ผู้จอง ${esc(s.user)}</p>
    <div class="grid">
      ${fieldHTML({ k:'unit', label:'หน่วย', type:'unit', req:true, w:'l' }, prefUnit())}
      ${isStaff() ? `<div class="fld full"><div class="lab">กลุ่มที่<span class="req">*</span></div><div class="chips">${groupChipsHTML(s.group || '', false)}</div></div>` : `<div class="fld"><div class="lab">กลุ่ม</div><b>กลุ่ม ${esc(s.group)}</b></div>`}
      ${fieldHTML({ k:'note', label:'จะตรวจอะไร (ไม่บังคับ) เช่น Blood smear 10 ตัว, McMaster', type:'text', w:'full' }, '')}
    </div>
    <div class="acts"><button class="btn" data-v="null">ยกเลิก</button><button class="btn pri" data-v="ok" data-collect="1">จอง</button></div>`);
  if (!v || typeof v !== 'object') return;
  const group = isStaff() ? v.group : s.group;
  if (!group) return toast('กรุณาเลือกกลุ่ม', 'warn');
  const unit = v.unit;
  if (!unit) return toast('กรุณาเลือกหน่วย', 'warn');
  setPrefUnit(unit);
  const quota = Number(S.cfg.bookingQuota) || 2;
  const same = rows('LabBooking').filter(b => Number(b.campDay) === day && b.slot === slot && b.room === room);
  if (same.some(b => b.unit === unit && String(b.group) === String(group))) return toast('กลุ่มนี้จองช่วงนี้ไว้แล้ว', 'warn');
  if (same.length >= quota) return toast('ช่วงนี้เต็มแล้ว', 'warn');
  const r = await saveRecord('LabBooking', uuid(), { campDay: day, date: S.campDates[day] || '', slot, room, unit, group, note: v.note, bookedBy: s.user }, { isNew: true, silent: true });
  if (r.error) {
    // เต็มระหว่างที่กำลังจอง (มีคนจองตัดหน้า) → ถอนรายการในเครื่องแล้วแจ้ง
    S.queue = S.queue.filter(q => q.id !== r.q.id); saveQueue();
    S.data.LabBooking = S.data.LabBooking.filter(b => b.id !== r.q.id); saveCache();
    toast('จองไม่สำเร็จ: ' + r.error.message, 'err', 6000);
    sync();
  } else saveToast(r, `จอง Day ${day} ${slot} แล้ว`);
  after();
}

const nl2br = s => esc(s).replace(/\n/g, '<br>');
function printCase(c) {

  };
  const info = [
    ['เลขตัวอย่าง', c.sampleNo || 'รอเลข'], ['วันที่', `Day ${c.campDay || '-'} · ${c.date || ''}`], ['หน่วย', unitName(c.unit)], ['กลุ่มที่', c.group || '-'],
    [g === 'LA' ? 'Ear tag / หมายเลข' : 'ชื่อสัตว์', animalLabel(c)], ['ชนิด / สายพันธุ์', [c.species, c.breed].filter(Boolean).join(' / ') || '-'],
    ['เพศ', [c.sex, c.neutered === 'ใช่' ? 'ทำหมันแล้ว' : ''].filter(Boolean).join(' ') || '-'], ['อายุ', filled(c.age) ? `${c.age} ${c.ageUnit || ''}` : '-'],
    [g === 'LA' ? 'ฟาร์ม / เจ้าของ' : 'เจ้าของ', [g === 'LA' ? c.farmName : '', c.ownerName].filter(Boolean).join(' / ') || '-'],
    ['ที่อยู่', [c.houseNo, c.moo ? 'ม.' + c.moo : '', c.subdistrict ? 'ต.' + c.subdistrict : '', c.district ? 'อ.' + c.district : ''].filter(Boolean).join(' ') || '-'],
    ['ชนิดตัวอย่าง / ปริมาณ', filled(c.sampleAmount) ? String(c.sampleAmount).replace(/;/g, ',') : (splitMulti(c.sampleTypes).join(', ') || '-')], ['ส่งตรวจ', requestedTests(c).map(k => TESTS.find(t => t.k === k).short).join(', ') || '-']
  ];
  const itr = []; for (let i = 0; i < info.length; i += 2) itr.push(`<tr><td class="k">${info[i][0]}</td><td class="v">${esc(info[i][1])}</td><td class="k">${info[i + 1][0]}</td><td class="v">${esc(info[i + 1][1])}</td></tr>`);

    <div class="rh"><div><div class="t1">ใบรายงานผลการตรวจทางห้องปฏิบัติการ (LAB PATH)</div>
      <div class="t2">${esc(S.cfg.campName || 'ค่ายสัตวแพทย์อาสา สพช.')} · คณะสัตวแพทยศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย</div></div>
      <div class="sn">${esc(c.sampleNo || 'รอเลข')}<div class="st">${esc(c.status || '')}</div></div></div>
    <table class="pt info">${itr.join('')}</table>
    ${c.otherSigns || c.physicalExam ? `<div class="lt"><b>อาการ / PE:</b> ${nl2br([c.otherSigns, c.physicalExam].filter(Boolean).join(' · '))}</div>` : ''}
    ${tests.length ? tests.map(secHTML).join('') : '<p>ยังไม่มีผลการตรวจ</p>'}
    ${c.remarks ? `<div class="lt"><b>หมายเหตุ:</b> ${nl2br(c.remarks)}</div>` : ''}
    <table class="sig"><tr>
      <td>ลงชื่อ ......................................................<br>( ${esc(recorder)} )<br>ผู้บันทึกผล</td>
      <td>ลงชื่อ ......................................................<br>( ${esc(c.verifiedBy || '                              ')} )<br>ผู้ตรวจสอบ (Lab-path)${c.verifiedAt ? '<br>' + fmtTime(c.verifiedAt) : ''}</td></tr></table>
    <div class="foot">พิมพ์จาก LabPath โดย ${esc(S.session.user)} · ${new Date().toLocaleString('th-TH')} · ${c.status === ST.VERIFIED ? 'ผลผ่านการตรวจสอบแล้ว' : 'ผลยังไม่ผ่านการตรวจสอบโดย Lab-path'}</div>

/* =====================================================================

const DEID_FIELDS = ['ownerName', 'houseNo', 'coordE', 'coordN'];
/** กลุ่มชนิดสัตว์สำหรับแยกรายงาน */
const speciesGroup = c => c.animalGroup === 'LA' ? 'โค/สัตว์ใหญ่' : (c.species || 'ไม่ระบุ');
function repFilters() { return Object.assign({ day: '', unit: '', sp: '' }, store.get('repFilter', {})); }
function repCases(f) {
  return rows('Cases').filter(c => (!f.day || String(c.campDay) === f.day) && (!f.unit || c.unit === f.unit) && (!f.sp || speciesGroup(c) === f.sp));
}
/** ความชุกรายเชื้อจากช่องผลแบบเลือกหลายอัน (fec_result / bp_result) */
function organismPrev(list, sec, field) {
  const tested = list.map(c => ({ c, g: c.animalGroup === 'LA' ? 'LA' : 'SA', row: resultRow(c) })).filter(o => hasData(o.g, sec, o.row));
  const cnt = {};
  let any = 0;
  tested.forEach(o => {
    const items = splitMulti(o.row[field]).filter(x => x !== 'ไม่พบ');
    if (items.length) any++;
    [...new Set(items)].forEach(x => cnt[x] = (cnt[x] || 0) + 1);
  });
  return { n: tested.length, any, items: Object.entries(cnt).sort((a, b) => b[1] - a[1]) };
}
const ciCells = (x, n) => { const ci = wilson(x, n); return `<td class="n mono">${x}</td><td class="n mono">${n}</td><td class="n mono"><b>${n ? pct(x / n) : '-'}</b></td><td class="n mono">${n ? pct(ci[0]) + '–' + pct(ci[1]) : '-'}</td>`; };
const ciBar = (x, n) => { if (!n) return ''; const ci = wilson(x, n); return `<div class="cibar"><i style="width:${(x / n * 100).toFixed(1)}%"></i><s style="left:${(ci[0] * 100).toFixed(1)}%;width:${((ci[1] - ci[0]) * 100).toFixed(1)}%"></s></div>`; };
function prevTableHTML(p, title) {
  if (!p.n) return `<div class="card"><h2>${esc(title)}</h2><div class="empty small">ยังไม่มีผลการตรวจตามตัวกรอง</div></div>`;
  return `<div class="card"><h2>${esc(title)} — ตรวจ ${p.n} ตัว · พบอย่างน้อย 1 ชนิด ${p.any} ตัว (${pct(p.any / p.n)}%)</h2>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>เชื้อ / ปรสิต</th><th class="n">พบ</th><th class="n">ตรวจ (n)</th><th class="n">ความชุก %</th><th class="n">95% CI</th><th style="width:30%">กราฟ</th></tr></thead><tbody>
    ${p.items.map(([k, x]) => `<tr><td><i>${esc(k)}</i></td>${ciCells(x, p.n)}<td>${ciBar(x, p.n)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">ไม่พบปรสิตในตัวอย่างที่ตรวจ</td></tr>'}
    <tr><td><b>พบอย่างน้อย 1 ชนิด</b></td>${ciCells(p.any, p.n)}<td>${ciBar(p.any, p.n)}</td></tr></tbody></table></div></div>`;
}
/** test kit: % positive (ไม่นับ "ไม่ได้ตรวจ" · Invalid แยกแสดง) */
function kitStats(list) {
  const fs = SECTIONS.SA.kit.filter(f => f.k !== 'kit_setting' && f.type !== 'photos');
  return fs.map(f => {
    const vals = list.filter(c => c.animalGroup !== 'LA').map(c => (resultRow(c) || {})[f.k]).filter(v => ['Positive', 'Negative', 'Invalid'].includes(v));
    const pos = vals.filter(v => v === 'Positive').length, neg = vals.filter(v => v === 'Negative').length, inv = vals.filter(v => v === 'Invalid').length;
    return { f, pos, neg, inv, n: pos + neg };
  });
}

/** สรุป "ตรวจแล้วเจออะไร" แยกตามชนิดการตรวจ — % คิดจากจำนวนตัวอย่างที่ลงผลการตรวจนั้นแล้ว */
function findingsHTML(list) {
  const PAL = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#7c3aed', '#0891b2', '#db2777', '#65a30d', '#b45309', '#4f46e5', '#0d9488', '#be123c'];
  const GREY = '#cbd5e1';
  // กราฟวงกลม SVG: items = [{label, v, color}]
  const pie = (items, size) => {
    const tot = items.reduce((a, b) => a + b.v, 0), r = size / 2, c = r;
    if (!tot) return '';
    let a0 = -Math.PI / 2;
    const segs = items.filter(i => i.v > 0).map(i => {
      const fr = i.v / tot, tip = `<title>${esc(i.label)}: ${i.v}</title>`;
      if (fr >= 0.9999) return `<circle cx="${c}" cy="${c}" r="${r}" fill="${i.color}">${tip}</circle>`;
      const a1 = a0 + fr * 2 * Math.PI, p = a => (c + r * Math.cos(a)).toFixed(2) + ' ' + (c + r * Math.sin(a)).toFixed(2);
      const d = `M${c} ${c} L${p(a0)} A${r} ${r} 0 ${fr > 0.5 ? 1 : 0} 1 ${p(a1)} Z`;
      a0 = a1;
      return `<path d="${d}" fill="${i.color}" stroke="#fff" stroke-width="1">${tip}</path>`;
    }).join('');
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(items.map(i => i.label + ' ' + i.v).join(', '))}">${segs}</svg>`;
  };
  const org = (title, sec, field) => {
    const p = organismPrev(list, sec, field);
    if (!p.n) return `<h3 style="margin:10px 0 4px">${esc(title)}</h3><div class="empty small" style="margin-bottom:14px">ยังไม่มีผลการตรวจ</div>`;
    const items = p.items.map(([k, x], i) => ({ label: k, v: x, color: PAL[i % PAL.length], it: true }));
    if (p.n - p.any > 0) items.push({ label: 'ไม่พบเชื้อ / ปรสิต', v: p.n - p.any, color: GREY });
    const multi = p.items.reduce((a, b) => a + b[1], 0) > p.any;
    return `<h3 style="margin:10px 0 4px">${esc(title)} <span class="small muted">— ตรวจแล้ว ${p.n} ตัวอย่าง · พบอย่างน้อย 1 ชนิด ${p.any} (${pct(p.any / p.n)}%)</span></h3>
      <div class="pies">${pie(items, 170)}<ul class="pielg">${items.map(i => `<li><span class="dot" style="background:${i.color}"></span><span>${i.it ? '<i>' + esc(i.label) + '</i>' : esc(i.label)}</span><span class="v mono">${i.v}/${p.n} · <b>${pct(i.v / p.n)}%</b></span></li>`).join('')}</ul></div>
      ${multi ? '<p class="small muted" style="margin-top:-10px">มีตัวอย่างที่พบมากกว่า 1 ชนิด — ขนาดชิ้นในกราฟแบ่งตามจำนวนครั้งที่พบ ส่วน % ด้านขวาคิดจากจำนวนตัวอย่างที่ตรวจ จึงรวมกันเกิน 100 ได้</p>' : ''}`;
  };
  const mini = (label, pos, n) => `<div class="minipie">${pie([{ label: 'Positive', v: pos, color: '#dc2626' }, { label: 'Negative', v: n - pos, color: GREY }], 84)}
    <div class="t">${esc(label)}</div><div class="small mono">Positive ${pos}/${n} · <b>${pct(pos / n)}%</b></div></div>`;
  const ks = kitStats(list).filter(k => k.n);
  const res = list.map(c => resultRow(c)).filter(Boolean);
  const pn = v => v === 'Positive' || v === 'Negative';
  const sat = res.filter(r => pn(r.sat)), fl = res.filter(r => pn(r.oc_fluo_od) || pn(r.oc_fluo_os));
  const others = (sat.length ? mini('Saline Agglutination Test', sat.filter(r => r.sat === 'Positive').length, sat.length) : '') +
    (fl.length ? mini('Fluorescein (ตาข้างใดข้างหนึ่ง)', fl.filter(r => r.oc_fluo_od === 'Positive' || r.oc_fluo_os === 'Positive').length, fl.length) : '');
  return `<div class="card"><h2>ตรวจแล้วเจออะไรบ้าง — แยกตามชนิดการตรวจ</h2>
    ${org('Blood parasite', 'bp', 'bp_result')}
    ${org('Fecal exam', 'feces', 'fec_result')}
    <h3 style="margin:10px 0 4px">Test kit <span class="small muted">— นับเฉพาะที่อ่านผลได้ (Positive + Negative) · <span style="color:#dc2626">■</span> Positive <span style="color:${GREY}">■</span> Negative</span></h3>
    ${ks.length ? `<div class="minipies">${ks.map(k => mini(k.f.label, k.pos, k.n)).join('')}</div>` : '<div class="empty small" style="margin-bottom:14px">ยังไม่มีผลการตรวจ</div>'}
    ${others ? `<h3 style="margin:10px 0 4px">อื่น ๆ</h3><div class="minipies">${others}</div>` : ''}
    <p class="small muted">% = จำนวนตัวอย่างที่พบ ÷ จำนวนตัวอย่างที่ลงผลการตรวจนั้นแล้ว × 100 · ตามตัวกรองด้านบน · ตารางพร้อม 95% CI ดูที่แท็บพยาธิทางเดินอาหาร / พยาธิในเม็ดเลือด / Test kit</p></div>`;
}

/* ---------- KPI สรุปผลรายวัน (PBL) — สัตว์ใหญ่ / สัตว์เล็ก ---------- */
/** แปลงเคส (และแถวสำรวจ BP โคแบบกรอกเป็นชุด) เป็นรายการกลาง: {g, day, unit, farm, req[], done{}, f[{name, sec}]} */
function kpiItems(list, f) {
  const out = [], ids = new Set(list.map(c => c.id)), pn = v => v === 'Positive' || v === 'Negative';
  list.forEach(c => {
    const g = c.animalGroup === 'LA' ? 'LA' : 'SA', row = resultRow(c);
    const it = { g, day: Number(c.campDay), unit: c.unit, farm: c.farmName || '(ไม่ระบุฟาร์ม)', req: requestedTests(c), done: {}, f: [] };
    [['bp', 'bp_result'], ['feces', 'fec_result']].forEach(([sec, fld]) => {
      if (!hasData(g, sec, row)) return;
      it.done[sec] = true;
      [...new Set(splitMulti(row[fld]).filter(x => x !== 'ไม่พบ'))].forEach(x => it.f.push({ name: x, sec }));
    });
    if (row && g === 'SA') {
      SECTIONS.SA.kit.filter(k => k.k !== 'kit_setting').forEach(k => { if (pn(row[k.k])) { it.done[k.k] = true; if (row[k.k] === 'Positive') it.f.push({ name: k.label + ' Positive', sec: k.k }); } });
      if (pn(row.sat)) { it.done.sat = true; if (row.sat === 'Positive') it.f.push({ name: 'Saline Agglutination Test Positive', sec: 'sat' }); }
    }
    out.push(it);
  });
  // สำรวจ Blood parasite โคแบบกรอกเป็นชุด (ไม่นับซ้ำกับเคสที่ผูก caseId)
  if (!f.sp || f.sp === 'โค/สัตว์ใหญ่') rows('BloodParasite_Cattle').forEach(r => {
    if (r.caseId && ids.has(r.caseId)) return;
    if ((f.day && String(r.campDay) !== String(f.day)) || (f.unit && r.unit !== f.unit)) return;
    out.push({ g: 'LA', day: Number(r.campDay), unit: r.unit, farm: r.farmName || '(ไม่ระบุฟาร์ม)', req: ['bp'], done: { bp: true }, survey: true,
      f: PATHO.filter(p => isPos(r[p.k])).map(p => ({ name: p.name.replace(/\s*\(.*$/, ''), sec: 'bp' })) });
  });
  return out;
}
/** จัดอันดับสิ่งที่พบ มาก → น้อย · n = จำนวนตัวอย่างที่ลงผลการตรวจชนิดนั้นแล้ว */
function kpiRank(items) {
  const m = {};
  items.forEach(it => it.f.forEach(x => { const k = x.sec + '|' + x.name; (m[k] = m[k] || { name: x.name, sec: x.sec, x: 0 }).x++; }));
  return Object.values(m).map(o => Object.assign(o, { n: items.filter(it => it.done[o.sec]).length })).sort((a, b) => b.x - a.x || a.name.localeCompare(b.name));
}
function kpiHTML(list, f) {
  const all = kpiItems(list, f), days = campDays();
  const rankHTML = (items, max) => {
    const rk = kpiRank(items), shown = max ? rk.slice(0, max) : rk;
    const tested = items.filter(it => Object.keys(it.done).length).length;
    if (!tested) return '<div class="small muted">ยังไม่มีผลการตรวจ</div>';
    if (!rk.length) return '<div class="small muted">ลงผลแล้ว ' + tested + ' ตัวอย่าง — ไม่พบเชื้อ / ผลบวก</div>';
    return `<ol class="kpilist">${shown.map((o, i) => `<li><span class="rk mono">${i + 1}.</span><span><i>${esc(o.name)}</i></span><span class="v mono">${o.x}/${o.n} · <b>${pct(o.x / o.n)}%</b></span></li>`).join('')}</ol>${rk.length > shown.length ? `<div class="small muted">และอีก ${rk.length - shown.length} รายการ</div>` : ''}`;
  };
  const reqHTML = items => {
    const n = items.length;
    const rowsH = TESTS.map(t => ({ t, x: items.filter(it => it.req.includes(t.k)).length })).filter(o => o.x).sort((a, b) => b.x - a.x)
      .map(o => `<tr><td>${esc(o.t.label)}</td><td class="n mono">${o.x}</td><td class="n mono"><b>${pct(o.x / n)}</b></td><td><div class="cibar"><i style="width:${(o.x / n * 100).toFixed(1)}%"></i></div></td></tr>`).join('');
    return `<div class="tblwrap"><table class="tbl"><thead><tr><th>ส่งตรวจ</th><th class="n">จำนวนตัวอย่าง</th><th class="n">% ของตัวอย่างทั้งหมด</th><th style="width:30%">กราฟ</th></tr></thead><tbody>${rowsH || '<tr><td colspan="4" class="muted">ยังไม่มีข้อมูล</td></tr>'}</tbody></table></div>
      <p class="small muted">ตัวอย่างหนึ่งส่งตรวจได้หลายอย่าง ผลรวม % จึงเกิน 100 ได้</p>`;
  };
  const byDayHTML = items => days.map(d => { const L = items.filter(it => it.day === d); return L.length ? `<div class="kpiday"><h3>Day ${d} <span class="small muted">— ${L.length} ตัวอย่าง${S.campDates[d] ? ' · ' + esc(S.campDates[d]) : ''}</span></h3>${rankHTML(L)}</div>` : ''; }).join('') || '<div class="small muted">ยังไม่มีข้อมูล</div>';
  const stat = (n, t) => `<div class="stat"><div class="n">${n}</div><div class="t">${t}</div></div>`;
  const section = (g, title) => {
    const items = all.filter(it => it.g === g), n = items.length;
    if (!n) return `<h2 style="margin-top:18px">${title}</h2><div class="card empty">ยังไม่มีตัวอย่างตามตัวกรอง</div>`;
    const tested = items.filter(it => Object.keys(it.done).length).length;
    const farms = [...new Set(items.map(it => it.farm))].sort((a, b) => a.localeCompare(b, 'th', { numeric: true }));
    const units = S.units.map(u => ({ u, x: items.filter(it => it.unit === u.code).length })).filter(o => o.x);
    const surveyN = items.filter(it => it.survey).length;
    return `<h2 style="margin-top:18px">${title}</h2>
      <div class="stats">${stat(n, '1. ส่งตัวอย่างทั้งหมด (ตัว)')}${g === 'LA' ? stat(farms.length, '2. จำนวนฟาร์ม') : ''}${stat(tested, 'ลงผลแล้ว (ตัว)')}${stat(n - tested, 'ยังไม่ลงผล (ตัว)')}</div>
      ${g === 'SA' ? `<div class="card"><h2>2. จำนวนตัวอย่างแยกตามหน่วย</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>หน่วย</th>${days.map(d => `<th class="n">Day ${d}</th>`).join('')}<th class="n">รวม</th><th class="n">%</th></tr></thead><tbody>
        ${units.map(o => `<tr><td><b>${esc(o.u.code)}</b> ${esc(o.u.name)}</td>${days.map(d => `<td class="n mono">${items.filter(it => it.unit === o.u.code && it.day === d).length || ''}</td>`).join('')}<td class="n mono"><b>${o.x}</b></td><td class="n mono">${pct(o.x / n)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
      <div class="card"><h2>3. ตัวอย่างทั้งหมดส่งตรวจอะไรบ้าง</h2>${reqHTML(items)}${surveyN ? `<p class="small muted">รวมตัวอย่างสำรวจ Blood parasite โคแบบกรอกเป็นชุด ${surveyN} ตัว (นับเป็นส่งตรวจ Blood parasite)</p>` : ''}</div>
      ${g === 'LA' ? `<div class="card"><h2>4.1 ผลตรวจรายฟาร์ม — ฟาร์มนี้เจออะไรเยอะ</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>ฟาร์ม</th><th class="n">ตัวอย่าง</th><th>ที่พบ (มาก → น้อย · พบ/ตรวจ)</th></tr></thead><tbody>
        ${farms.map(fm => { const L = items.filter(it => it.farm === fm); return `<tr><td><b>${esc(fm)}</b></td><td class="n mono">${L.length}</td><td>${rankHTML(L, 5)}</td></tr>`; }).join('')}</tbody></table></div></div>` : ''}
      <div class="card"><h2>${g === 'LA' ? '4.2' : '4.'} ผลตรวจรายวัน — วันนี้เจออะไรบ้าง (มาก → น้อย)</h2>${byDayHTML(items)}</div>`;
  };
  return `<div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn pri" type="button" id="kpiCsv">⬇ Export KPI (Excel/CSV)</button></div>
    <div class="alert info small">สรุปสำหรับนำเสนอ PBL · เลือก "วัน" ด้านบนเพื่อดูเฉพาะวันนั้น · ตัวเลข "พบ/ตรวจ" = จำนวนตัวอย่างที่พบ ÷ จำนวนตัวอย่างที่ลงผลการตรวจชนิดนั้นแล้ว</div>
    ${!f.sp || f.sp === 'โค/สัตว์ใหญ่' ? section('LA', '🐄 สัตว์ใหญ่') : ''}${f.sp === 'โค/สัตว์ใหญ่' ? '' : section('SA', '🐕 สัตว์เล็ก')}`;
}

/** Export KPI เป็น CSV (1 ไฟล์ · ทุกหัวข้อในหน้า KPI ตามตัวกรอง) */
function kpiExport(list, f) {
  const all = kpiItems(list, f), days = campDays(), out = [];
  const P = (x, n) => n ? pct(x / n) : '';
  const add = (grp, topic, sub, item, x, n, note) => out.push([grp, topic, sub, item, x, n, P(x, n), note || '']);
  const rank = (grp, topic, sub, items) => {
    const rk = kpiRank(items);
    if (!items.some(it => Object.keys(it.done).length)) return add(grp, topic, sub, '(ยังไม่มีผลการตรวจ)', '', '');
    if (!rk.length) return add(grp, topic, sub, '(ไม่พบเชื้อ / ผลบวก)', '', '');
    rk.forEach((o, i) => add(grp, topic, sub, (i + 1) + '. ' + o.name, o.x, o.n));
  };
  [['LA', 'สัตว์ใหญ่'], ['SA', 'สัตว์เล็ก']].forEach(([g, gname]) => {
    if (g === 'LA' && f.sp && f.sp !== 'โค/สัตว์ใหญ่') return;
    if (g === 'SA' && f.sp === 'โค/สัตว์ใหญ่') return;
    const items = all.filter(it => it.g === g), n = items.length;
    const tested = items.filter(it => Object.keys(it.done).length).length;
    add(gname, '1. จำนวนตัวอย่าง', '', 'ส่งตัวอย่างทั้งหมด (ตัว)', n, '');
    add(gname, '1. จำนวนตัวอย่าง', '', 'ลงผลแล้ว (ตัว)', tested, n);
    add(gname, '1. จำนวนตัวอย่าง', '', 'ยังไม่ลงผล (ตัว)', n - tested, n);
    if (!n) return;
    const farms = [...new Set(items.map(it => it.farm))].sort((a, b) => a.localeCompare(b, 'th', { numeric: true }));
    if (g === 'LA') {
      add(gname, '2. จำนวนฟาร์ม', '', 'จำนวนฟาร์ม', farms.length, '');
      farms.forEach(fm => add(gname, '2. จำนวนฟาร์ม', '', fm, items.filter(it => it.farm === fm).length, n));
    } else {
      S.units.forEach(u => {
        const L = items.filter(it => it.unit === u.code); if (!L.length) return;
        add(gname, '2. จำนวนตัวอย่างแยกตามหน่วย', 'รวมทุกวัน', u.code + ' — ' + u.name, L.length, n);
        days.forEach(d => { const x = L.filter(it => it.day === d).length; if (x) add(gname, '2. จำนวนตัวอย่างแยกตามหน่วย', 'Day ' + d, u.code + ' — ' + u.name, x, ''); });
      });
    }
    TESTS.map(t => ({ t, x: items.filter(it => it.req.includes(t.k)).length })).filter(o => o.x).sort((a, b) => b.x - a.x)
      .forEach(o => add(gname, '3. ส่งตรวจอะไรบ้าง', '', o.t.label, o.x, n, '% ของตัวอย่างทั้งหมด'));
    if (g === 'LA') farms.forEach(fm => rank(gname, '4.1 ผลตรวจรายฟาร์ม', fm, items.filter(it => it.farm === fm)));
    days.forEach(d => { const L = items.filter(it => it.day === d); if (L.length) rank(gname, g === 'LA' ? '4.2 ผลตรวจรายวัน' : '4. ผลตรวจรายวัน', 'Day ' + d + (S.campDates[d] ? ' (' + S.campDates[d] + ')' : ''), L); });
  });
  const tag = [f.day ? 'day' + f.day : 'alldays', f.unit, f.sp ? (f.sp === 'โค/สัตว์ใหญ่' ? 'LA' : f.sp) : ''].filter(Boolean).join('_');
  downloadCSV(`labpath_KPI_${tag}_${todayStr()}.csv`, ['กลุ่มสัตว์', 'หัวข้อ', 'ฟาร์ม / วัน / หน่วย', 'รายการ', 'จำนวน', 'จากทั้งหมด (n)', '%', 'หมายเหตุ'], out);
  toast('ดาวน์โหลด KPI แล้ว', 'ok');
}

/** รายงาน PBL โค: แถวโค (เคสรายตัว + กรอกเป็นชุด) ตามตัวกรองรายงาน */
function repCattle(f) {
  if (f.sp && f.sp !== 'โค/สัตว์ใหญ่') return [];
  return cattleAll().filter(r => (!f.day || String(r.campDay) === f.day) && (!f.unit || f.unit === 'LA' || r.unit === f.unit));
}

function critReportHTML(cat) {

  const bins = [['< 15% (โลหิตจางรุนแรง)', 0, 15], ['15–19%', 15, 20], ['20–23%', 20, 24], ['24–46% (ปกติ)', 24, 46.0001], ['> 46%', 46.0001, 1e9]];

/** สร้าง CSV จากแถวของชีต (ใช้ลำดับคอลัมน์ตามชีต) */
function rowsToCSV(fname, data, drop = []) {
  if (!data.length) return toast('ไม่มีข้อมูลตามตัวกรอง', 'warn');
  const cols = []; data.forEach(r => Object.keys(r).forEach(k => { if (!k.startsWith('_') && !drop.includes(k) && !cols.includes(k)) cols.push(k); }));
  downloadCSV(fname, cols, data.map(r => cols.map(k => r[k])));
}
function resultsForExport(sheet, list) {
  const ids = new Set(list.map(c => c.id)), byId = Object.fromEntries(list.map(c => [c.id, c]));
  const res = rows(sheet).filter(r => ids.has(r.caseId));
  const orgs = { fec: new Set(), bp: new Set() };
  res.forEach(r => { splitMulti(r.fec_result).forEach(x => orgs.fec.add(x)); splitMulti(r.bp_result).forEach(x => orgs.bp.add(x)); });
  return res.map(r => {
    const c = byId[r.caseId] || {};
    const o = { sampleNo: c.sampleNo, campDay: c.campDay, unit: c.unit, group: c.group, species: c.species, breed: c.breed, sex: c.sex, age: c.age, ageUnit: c.ageUnit, moo: c.moo };
    Object.keys(r).forEach(k => { if (!k.startsWith('_') && !(k in o)) o[k] = r[k]; });
    [...orgs.fec].filter(x => x !== 'ไม่พบ').forEach(x => o['fec_' + x] = splitMulti(r.fec_result).includes(x) ? 1 : (filled(r.fec_result) ? 0 : ''));
    [...orgs.bp].filter(x => x !== 'ไม่พบ').forEach(x => o['bp_' + x] = splitMulti(r.bp_result).includes(x) ? 1 : (filled(r.bp_result) ? 0 : ''));
    return o;
  });
}
function runExport(kind, list, f) {
  const d = todayStr(), sfx = (f.day ? '_D' + f.day : '') + (f.unit ? '_' + f.unit : '');
  const dayOk = r => (!f.day || String(r.campDay) === f.day) && (!f.unit || r.unit === f.unit);
  switch (kind) {
    case 'cases': return rowsToCSV(`cases${sfx}_${d}.csv`, list);
    case 'cases_deid': return rowsToCSV(`cases_deid${sfx}_${d}.csv`, list, DEID_FIELDS);
    case 'sa': return rowsToCSV(`sa_results${sfx}_${d}.csv`, resultsForExport('SA_Results', list));
    case 'la': return rowsToCSV(`la_results${sfx}_${d}.csv`, resultsForExport('LA_Results', list));
    case 'cattle': return rowsToCSV(`bloodparasite_cattle${sfx}_${d}.csv`, rows('BloodParasite_Cattle').filter(dayOk));
    case 'kitlog': return rowsToCSV(`testkit_log${sfx}_${d}.csv`, rows('TestKitLog').filter(dayOk));
    case 'supply': return rowsToCSV(`supply_log${sfx}_${d}.csv`, rows('SupplyLog').filter(dayOk));
    case 'booking': return rowsToCSV(`lab_booking${sfx}_${d}.csv`, rows('LabBooking').filter(dayOk));
    case 'sum_fecal': case 'sum_bp': {
      const sec = kind === 'sum_fecal' ? 'feces' : 'bp', fld = sec === 'feces' ? 'fec_result' : 'bp_result';
      const groups = [['ทั้งหมด', list], ...[...new Set(list.map(speciesGroup))].sort().map(sp => [sp, list.filter(c => speciesGroup(c) === sp)])];
      const out = [];
      groups.forEach(([gn, L]) => { const p = organismPrev(L, sec, fld);
        p.items.forEach(([k, x]) => { const ci = wilson(x, p.n); out.push([gn, k, x, p.n, pct(x / p.n), pct(ci[0]), pct(ci[1])]); });
        if (p.n) { const ci = wilson(p.any, p.n); out.push([gn, 'พบอย่างน้อย 1 ชนิด', p.any, p.n, pct(p.any / p.n), pct(ci[0]), pct(ci[1])]); } });
      return downloadCSV(`${kind === 'sum_fecal' ? 'prevalence_fecal' : 'prevalence_bloodparasite_cases'}${sfx}_${d}.csv`, ['species_group', 'organism', 'positive', 'n', 'prevalence_pct', 'ci95_low', 'ci95_high'], out);
    }
    case 'sum_kit': return downloadCSV(`testkit_positive${sfx}_${d}.csv`, ['test', 'positive', 'negative', 'invalid', 'n_valid', 'positive_pct', 'ci95_low', 'ci95_high'],
      kitStats(list).map(s => { const ci = wilson(s.pos, s.n); return [s.f.label, s.pos, s.neg, s.inv, s.n, s.n ? pct(s.pos / s.n) : '', s.n ? pct(ci[0]) : '', s.n ? pct(ci[1]) : '']; }));
    case 'sum_count': return downloadCSV(`sample_counts_${d}.csv`, ['unit', ...campDays().map(x => 'Day ' + x), 'total'],
      S.units.map(u => { const L = list.filter(c => c.unit === u.code); return [u.code + ' ' + u.name, ...campDays().map(x => L.filter(c => Number(c.campDay) === x).length), L.length]; }));
  }
}

      body = `<div class="card"><h2>ค่าทั่วไป</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>ตั้งค่า</th><th>ค่า</th></tr></thead><tbody>
        ${idx('config').map(([r, i]) => `<tr><td>${esc(r.label || r.key)}<div class="small muted mono">${esc(r.key)}</div></td><td>${inp(i, 'value')}</td></tr>`).join('')}</tbody></table></div>
        <p class="small muted">bookingSlots = ช่วงเวลาจองห้อง คั่นด้วย , · bookingQuota = จำนวนกลุ่มต่อช่อง · HN = วัน + SA/OB/LA + กลุ่ม 2 หลัก + ลำดับที่ 3 หลัก (เช่น 1-SA-02-003, 1-OB-02-003, 1-LA-02-003) — หน่วยกรอกลำดับที่เอง</p></div>`;
    } else if (tab === 'days') {
      body = `<div class="card"><h2>วันค่าย</h2><table class="tbl"><thead><tr><th>Day</th><th>ชื่อ</th><th>วันที่ (ค.ศ.)</th></tr></thead><tbody>
          ${idx('campDate').map(([r, i]) => `<tr><td class="mono">${esc(r.key)}</td><td>${inp(i, 'label')}</td><td>${inp(i, 'value', 'type="date"')}</td></tr>`).join('')}</tbody></table>
          <div class="row" style="margin-top:8px">${addBtn('campDate', 'เพิ่มวัน')}</div><p class="small muted">ถ้าเพิ่ม/ลดวัน ให้แก้ค่า campDays ในแท็บ "ค่าทั่วไป" ให้ตรงด้วย</p></div>
        <div class="card"><h2>หน่วย</h2><table class="tbl"><thead><tr><th>รหัสย่อ (อยู่ในเลขตัวอย่าง)</th><th>ชื่อหน่วย</th><th>กลุ่มสัตว์ | ชนิดตั้งต้น</th><th></th></tr></thead><tbody>
          ${idx('unit').map(([r, i]) => `<tr><td>${inp(i, 'key', 'style="width:80px"')}</td><td>${inp(i, 'label')}</td><td>${inp(i, 'value', 'placeholder="SA หรือ LA|โคนม"')}</td><td>${del(i)}</td></tr>`).join('')}</tbody></table>
          <div class="row" style="margin-top:8px">${addBtn('unit', 'เพิ่มหน่วย')}</div><p class="small muted">อย่าเปลี่ยนรหัสย่อของหน่วยที่มีข้อมูลแล้ว (เลขตัวอย่างเดิมผูกกับรหัสนี้)</p></div>`;
    } else if (tab === 'kits') {
      const tbl = (cat, title) => `<div class="card"><h2>${title}</h2><table class="tbl"><thead><tr><th>ชื่อรายการ</th><th class="n">จำนวนตั้งต้นในตู้</th><th></th></tr></thead><tbody>
        ${idx(cat).map(([r, i]) => `<tr><td>${inp(i, 'key')}</td><td class="n">${inp(i, 'value', 'inputmode="numeric" style="width:100px;text-align:right"')}</td><td>${del(i)}</td></tr>`).join('')}</tbody></table>
        <div class="row" style="margin-top:8px">${addBtn(cat, 'เพิ่มรายการ')}</div></div>`;
      body = tbl('kit', 'Test kit');
    } else if (tab === 'lists') {
      const names = [...new Set(idx('list').map(([r]) => r.key))];
      body = names.map(n => `<div class="card"><h2 class="mono" style="font-size:13px">${esc(n)}</h2><div class="chips">
          ${idx('list').filter(([r]) => r.key === n).map(([r, i]) => `<span class="lchip"><input data-i="${i}" data-f="label" value="${esc(r.label)}" size="${Math.max(6, r.label.length)}"><button data-del="${i}" title="ลบ">✕</button></span>`).join('')}
          ${addBtn('list', 'เพิ่มตัวเลือก', n)}</div></div>`).join('') + '<p class="small muted">ตัวเลือก dropdown/ปุ่มกดในฟอร์ม · ลบตัวเลือกแล้ว ข้อมูลเดิมที่เลือกไว้ไม่หาย</p>';
    } else if (tab === 'members') {
      const q = store.get('memberQ', '');
      const list = idx('member').filter(([r]) => !q || r.key.includes(q) || String(r.value) === q);
      body = `<div class="card"><h2>รายชื่อนิสิต (${idx('member').length} คน) — ชื่อผูกกับกลุ่ม</h2>
          <div class="row"><input id="mq" type="search" placeholder="ค้นชื่อ หรือเลขกลุ่ม" value="${esc(q)}" style="max-width:280px">${addBtn('member', 'เพิ่มคน')}</div>
          <div class="tblwrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>ชื่อ-สกุล (ตามที่ใช้เข้าระบบ)</th><th>กลุ่ม</th><th></th></tr></thead><tbody>
          ${list.map(([r, i]) => `<tr><td>${inp(i, 'key')}</td><td><select data-i="${i}" data-f="value">${groupList().map(g => `<option ${String(r.value) === g ? 'selected' : ''}>${g}</option>`).join('')}</select></td><td>${del(i)}</td></tr>`).join('')}
          </tbody></table></div><p class="small muted">ย้ายกลุ่มมีผลกับการบันทึกครั้งถัดไปของคนนั้น · ข้อมูลเดิมยังอยู่ในกลุ่มเดิม</p></div>`;
    } else {
      body = `<div class="card" style="border-color:#f0a8b3"><h2 style="border-left-color:var(--err);color:var(--err)">ล้างข้อมูล</h2>
          <p><button class="btn warn" id="clrDemo">ลบข้อมูลตัวอย่าง (DEMO)</button> <span class="small muted">ลบเฉพาะแถวที่สร้างโดย DEMO</span></p>
          <p><button class="btn danger" id="clrAll">ลบข้อมูลทั้งหมด (เริ่มค่ายใหม่)</button> <span class="small muted">ลบทุกเคส ผลแลป เบิก kit จองห้อง และประวัติ · ตั้งค่าและรายชื่อยังอยู่ · กู้คืนไม่ได้ ควรสำรองชีตก่อน (ไฟล์ › ทำสำเนา)</span></p></div>
        <div class="card"><h2>PIN</h2><p class="small">PIN เก็บที่ Apps Script › Project Settings › Script Properties (CAMP_PIN, LABPATH_PIN, ADMIN_PIN) — เปลี่ยนจากหน้าเว็บไม่ได้โดยตั้งใจ</p></div>`;
    }
    el.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:8px"><h1 style="margin:0">ตั้งค่า (Admin)</h1>
        <div class="row"><button class="btn" id="setReset" ${dirty ? '' : 'disabled'}>ยกเลิกที่แก้</button><button class="btn pri" id="setSave" ${dirty ? '' : 'disabled'}>💾 บันทึกการตั้งค่า</button></div></div>
      ${dirty ? '<div class="alert warn small">มีการแก้ไขที่ยังไม่ได้บันทึก — ทุกเครื่องจะเห็นค่าใหม่ภายใน ~30 วินาทีหลังบันทึก</div>' : ''}
      <nav class="tabs">${[['config', 'ค่าทั่วไป'], ['days', 'วันค่าย / หน่วย'], ['kits', 'Test kit'], ['lists', 'ตัวเลือกในฟอร์ม'], ['members', 'รายชื่อนิสิต'], ['danger', '⚠ ล้างข้อมูล']]
        .map(([k, t]) => `<a href="#/settings/${k}" class="${k === tab ? 'act' : ''}">${t}</a>`).join('')}</nav>${body}`;
    $$('[data-i]', el).forEach(x => x.oninput = x.onchange = () => { W[Number(x.dataset.i)][x.dataset.f] = x.value; keep(); });
    $$('[data-del]', el).forEach(b => b.onclick = () => { W.splice(Number(b.dataset.del), 1); keep(); draw(); });
    $$('[data-add]', el).forEach(b => b.onclick = () => {
      const cat = b.dataset.add, key = b.dataset.key || '';
      const nr = { category: cat, key: cat === 'campDate' ? String(idx('campDate').length + 1) : key, label: cat === 'campDate' ? 'Day ' + (idx('campDate').length + 1) : '', value: cat === 'member' ? '1' : '', note: '' };
      const last = W.map((r, i) => [r, i]).filter(([r]) => r.category === cat && (!key || r.key === key)).pop();
      W.splice(last ? last[1] + 1 : W.length, 0, nr); keep(); draw();
    });
    const mq = $('#mq', el); if (mq) mq.oninput = () => { store.set('memberQ', mq.value.trim()); draw(); $('#mq', el).focus(); };
    $('#setReset', el).onclick = () => { store.del('draft_settings'); W = S.settings.map(r => ({ category: r.category, key: String(r.key ?? ''), label: String(r.label ?? ''), value: String(r.value ?? ''), note: String(r.note ?? '') })); dirty = false; draw(); };
    $('#setSave', el).onclick = save;
    const cd = $('#clrDemo', el); if (cd) cd.onclick = async () => {
      if (!await confirmBox('ลบข้อมูลตัวอย่าง (DEMO)?', 'ลบเฉพาะแถวที่ผู้สร้างเป็น DEMO', 'ลบ', 'warn')) return;
      const r = await api('clearDemo').catch(e => ({ ok: false, message: e.message }));
      toast(r.ok ? `ลบแล้ว ${r.removed} แถว` : 'ไม่สำเร็จ: ' + r.message, r.ok ? 'ok' : 'err'); if (r.ok) sync(true);
    };
    const ca = $('#clrAll', el); if (ca) ca.onclick = async () => {
      const v = await modal(`<h2 style="color:var(--err)">ลบข้อมูลทั้งหมด?</h2><p>ทุกเคส ผลแลป เบิก kit จองห้อง และประวัติการแก้ไขจะถูกลบ <b>กู้คืนไม่ได้</b> (ตั้งค่าและรายชื่อยังอยู่)</p>
        <div class="fld"><label>พิมพ์คำว่า <b>ลบทั้งหมด</b> เพื่อยืนยัน</label><input name="confirm" autocomplete="off"></div>
        <div class="acts"><button class="btn" data-v="null">ยกเลิก</button><button class="btn danger" data-v="ok" data-collect="1">ลบทั้งหมด</button></div>`);
      if (!v || v.confirm !== 'ลบทั้งหมด') { if (v) toast('พิมพ์คำยืนยันไม่ตรง', 'warn'); return; }
      const r = await api('clearAll', { confirm: 'ลบทั้งหมด' }).catch(e => ({ ok: false, message: e.message }));
      toast(r.ok ? `ลบแล้ว ${r.removed} แถว` : 'ไม่สำเร็จ: ' + r.message, r.ok ? 'ok' : 'err'); if (r.ok) sync(true);
    };
  };
  const save = async () => {
    const bad = W.find(r => ['unit', 'kit', 'supply', 'member', 'list'].includes(r.category) && !String(r.category === 'list' ? r.label : r.key).trim());
    if (bad) return toast('มีแถวที่ยังไม่ได้ใส่ชื่อ (หมวด ' + bad.category + ')', 'warn');
    const codes = idx('unit').map(([r]) => r.key.trim()); if (new Set(codes).size !== codes.length) return toast('รหัสหน่วยซ้ำกัน', 'warn');
    const names = idx('member').map(([r]) => normName(r.key)); if (new Set(names).size !== names.length) return toast('มีรายชื่อนิสิตซ้ำกัน', 'warn');
    const out = W.map((r, i) => ({ category: r.category, key: r.key.trim(), label: r.category === 'list' ? r.label.trim() : (r.label || '').trim() || r.key.trim(),
      value: r.category === 'list' ? r.label.trim() : String(r.value ?? '').trim(), sort: i + 1, active: true, note: r.note || '' }));
    const b = $('#setSave', el); b.disabled = true; b.textContent = 'กำลังบันทึก…';
    try {
      const r = await api('saveSettings', { rows: out });
      if (!r.ok) throw new Error(r.message);
      applySettings(r.settings); saveCache(); store.del('draft_settings');
      W = S.settings.map(x => ({ category: x.category, key: String(x.key ?? ''), label: String(x.label ?? ''), value: String(x.value ?? ''), note: String(x.note ?? '') }));
      dirty = false; toast('บันทึกการตั้งค่าแล้ว', 'ok'); renderShell(); route();
    } catch (e) { toast('บันทึกไม่สำเร็จ: ' + (e.network ? 'ต้องออนไลน์' : e.message), 'err', 6000); b.disabled = false; b.textContent = '💾 บันทึกการตั้งค่า'; }
  };
  draw();
}

/* =====================================================================
 * 15) หน้าที่จะเพิ่มในส่วนถัดไป + คู่มือ
 * ===================================================================== */
const soon = (title, part) => el => { el.innerHTML = `<h1>${esc(title)}</h1><div class="card empty">หน้านี้จะเพิ่มใน <b>ส่วนที่ ${part}</b></div>`; };

function showGuide() {
  modal(`<h2>📖 คู่มือการใช้งานฉบับย่อ</h2>
    <ol class="steps">
      <li><b>เก็บตัวอย่าง</b> ในพื้นที่ (เลือด อุจจาระ ปัสสาวะ ผิวหนัง ฯลฯ)</li>
      <li><b>รับตัวอย่าง</b> เมนู "＋ รับตัวอย่าง" → เลือกชนิดสัตว์ ใส่ชื่อ/ear tag และติ๊ก "ส่งตรวจอะไรบ้าง" → ได้เลขตัวอย่าง เช่น <span class="mono">D1-SA-001</span> เขียนลงหลอด/ถุงทันที</li>
      <li><b>ตรวจ</b> ที่หน้างาน (<span class="fl F">F</span> Field) หรือในห้องแลป (<span class="fl L">L</span> Lab) — จองห้องแลปได้ที่เมนู "จองห้องแลป"</li>
      <li><b>ลงผล</b> หน้า "🧪 ผลแลปวันนี้" เลือกแท็บการตรวจ (Blood, Fecal …) → กด "ลงผล" ที่ตัวนั้น → 💾 บันทึก · ลงผลครบแล้วกด "ส่งให้ Lab-path ตรวจสอบ"</li>
      <li><b>Lab-path ตรวจสอบ</b> → "ตรวจสอบแล้ว" หรือ "ส่งกลับแก้ไข" (เคสที่ต้องแก้จะขึ้นที่หน้าหลักของหน่วย)</li>
      <li><b>Blood parasite โค</b> กรอกเป็นชุดตามฟาร์ม (ติ๊กเชื้อที่ Positive) → ดูความชุก + 95% CI และ export CSV ที่หน้า "🐄 Blood parasite โค"</li>
    </ol>
    <h3 style="margin-top:14px">ป้ายสถานะการเชื่อมต่อ (มุมขวาบน)</h3>
    <p class="small"><span class="pill on"><span class="dot"></span>ออนไลน์</span> ข้อมูลส่งแล้ว ·
      <span class="pill q">⏳ รอส่ง n รายการ</span> เน็ตหลุด ข้อมูลอยู่ในเครื่อง ระบบส่งให้เองเมื่อมีเน็ต (ห้ามล้างข้อมูลเบราว์เซอร์) ·
      <span class="pill bad">⚠ มีปัญหา</span> กดเพื่อดูและแก้</p>
    <p class="small">ข้อมูลจากเครื่องอื่นจะขึ้นเองภายใน ~30 วินาที · ถ้ามีคนแก้เคสเดียวกันพร้อมกัน ระบบจะให้เลือกว่าจะใช้ค่าไหน ไม่เขียนทับกัน</p>
    <div class="acts"><a class="btn" href="manual.html" target="_blank" rel="noopener">📖 เปิดคู่มือฉบับเต็ม</a><button class="btn pri" data-v="null">เข้าใจแล้ว</button></div>`);
}

const VIEWS = {
  lab: VIEWS_lab, dashboard: VIEWS_dashboard, search: VIEWS_search, new: VIEWS_new, case: VIEWS_case, cattle: VIEWS_cattle, kits: VIEWS_kits, booking: VIEWS_booking,
  reports: VIEWS_reports, settings: VIEWS_settings
};

/* =====================================================================
 * 16) เริ่มต้นแอป
 * ===================================================================== */
loadCache();
// การเข้าใช้งานใช้ได้เฉพาะวันที่เข้า → วันใหม่ต้องยืนยันชื่อ + หน่วยอีกครั้ง (คิวรอส่งยังอยู่)
if (S.session && S.session.day === todayStr()) startApp(false);
else if (S.session) logout('เริ่มวันใหม่ — กรุณายืนยันชื่อและหน่วยที่ปฏิบัติงานวันนี้', true);
else renderLogin();
</script>
</body>
